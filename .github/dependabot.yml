version: 2

# Dependency currency for the orchestration repo.
#
# House policy across this workspace: weekly, and **majors are proposed too**.
# Dependabot opens the PR; merging is still a human act, so "automatic" here
# means the bump is surfaced rather than silently skipped. A major that nobody
# is told about is not a decision, it is drift — which is precisely how
# `grafana/loki` reached 3.4.2 in localAIStack by hand.
#
# **The Loki 2.x -> 3.x migration is done** (2026-10-17, ReleaseRoadmap B3):
# `docker-compose.yml` pins `grafana/loki:3.4.2` and `grafana/promtail:3.4.2`,
# and `config/loki-config.yml` uses `delete_request_store` in place of the
# `shared_store` keys 3.x removed. Keep a future Loki major the same way: the
# config migrates in the same PR, because Loki rejects a stale config on every
# boot and crash-loops *quietly* (a logging sidecar fails without failing
# anything else; localAIStack#77 sat that way for weeks). Versions here must
# match config/shared-service-versions.json, which the Scripts Unit Tests job
# checks.

updates:

  # Compose service images + the repo's own Dockerfiles.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    groups:
      observability:
        patterns:
          - "grafana/*"
          - "prom/*"
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /mcp
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 3

  - package-ecosystem: docker
    directory: /docker/scala
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 3

  # Orchestration tooling (Playwright, TypeScript) and the MCP service.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    groups:
      playwright:
        patterns:
          - "@playwright/*"
          - "playwright*"
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /mcp
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
