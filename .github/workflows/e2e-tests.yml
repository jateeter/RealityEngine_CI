name: E2E Tests

# This lane runs the engines from CI-built trees and containers, not from the
# local working copies startUniverse.sh normally launches. The build-provenance
# gate is about the local lane: here there is no checked-in artifact to be stale
# against, so requiring one would fail every run for a condition that cannot
# occur. Git state is still checked where a checkout exists.
env:
  RE_PROVENANCE_LANE: hosted

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      engine:
        description: 'RE/PE engine (ai|cpp|lsp)'
        required: false
        default: 'ai'

# ── Repository layout in the runner workspace ─────────────────────────────
# All repos are checked out as siblings inside the runner's $GITHUB_WORKSPACE:
#
#   workspace/
#     RealityEngine_CI/           ← this repo (default checkout path)
#     RealityEngine_Scala/
#     RealityEngine_Manager/
#     RealityEngine_Machines/
#     localAIStack/
#     localOpenClawStack/
#
# startUniverse.sh uses CI_DIR/../<repo> relative paths, so this layout
# satisfies all sibling-repo references without any path overrides.

jobs:

  # ── Phase 2: Static analysis gate ──────────────────────────────────────────
  shellcheck:
    name: Shell Lint (shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout RealityEngine_CI
        uses: actions/checkout@v4
        with:
          path: RealityEngine_CI

      - name: Checkout RealityEngine_CPP
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/RealityEngine_CPP
          path: RealityEngine_CPP
          token: ${{ secrets.REPO_ACCESS_TOKEN || github.token }}

      - name: Checkout RealityEngine_LSP
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/RealityEngine_LSP
          path: RealityEngine_LSP
          token: ${{ secrets.REPO_ACCESS_TOKEN || github.token }}

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck on all CI-managed scripts
        working-directory: RealityEngine_CI
        run: bash scripts/lint.sh

  # ── Phase 2b: Dockerfile security scanning ─────────────────────────────────
  dockerfile-security:
    name: Dockerfile Lint & Scan (hadolint + trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout RealityEngine_CI
        uses: actions/checkout@v4
        with:
          path: RealityEngine_CI

      - name: Lint Dockerfiles (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true
          config: RealityEngine_CI/.hadolint.yaml
          # Scan all Dockerfiles in the CI repo
          dockerfile: RealityEngine_CI/Dockerfile
        continue-on-error: true

      - name: Lint all docker/ Dockerfiles
        run: |
          REPO_DIR="${{ github.workspace }}/RealityEngine_CI"
          dockerfiles=()
          while IFS= read -r f; do
            dockerfiles+=("/repo/${f#"$REPO_DIR/"}")
          done < <(find "$REPO_DIR/docker" -name 'Dockerfile*' 2>/dev/null)
          if [ ${#dockerfiles[@]} -eq 0 ]; then
            echo "No Dockerfiles found in docker/ directory, skipping."
            exit 0
          fi
          docker run --rm \
            -v "$REPO_DIR:/repo:ro" \
            hadolint/hadolint hadolint \
            --config /repo/.hadolint.yaml \
            "${dockerfiles[@]}"

      - name: Scan for secrets and misconfigurations (trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: RealityEngine_CI
          scanners: misconfig,secret
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: RealityEngine_CI/.trivyignore

  # ── Phase 2c: SURFACE_SPEC drift check ─────────────────────────────────────
  surface-spec-drift:
    name: SURFACE_SPEC Drift Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout RealityEngine_CI
        uses: actions/checkout@v4
        with:
          path: RealityEngine_CI

      - name: Checkout RealityEngine_CPP
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/RealityEngine_CPP
          path: RealityEngine_CPP
          token: ${{ secrets.REPO_ACCESS_TOKEN || github.token }}

      - name: Checkout RealityEngine_Scala
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/RealityEngine_Scala
          path: RealityEngine_Scala
          token: ${{ secrets.REPO_ACCESS_TOKEN || github.token }}

      - name: Checkout RealityEngine_LSP
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/RealityEngine_LSP
          path: RealityEngine_LSP
          token: ${{ secrets.REPO_ACCESS_TOKEN || github.token }}

      - name: Checkout RealityEngine_Manager
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/RealityEngine_Manager
          path: RealityEngine_Manager
          token: ${{ secrets.REPO_ACCESS_TOKEN || github.token }}

      # Machines holds the pointers for the four governance contracts that moved
      # to RealityEngine_CI/docs. Without this checkout the check reports them
      # "missing pointer" rather than verifying them.
      - name: Checkout RealityEngine_Machines
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/RealityEngine_Machines
          path: RealityEngine_Machines
          token: ${{ secrets.REPO_ACCESS_TOKEN || github.token }}

      # The specification has one home — RealityEngine_CI/SURFACE_SPEC.md — and
      # each runtime repo holds a pointer to it. This step used to diff a
      # canonical copy in RealityEngine_CPP against three duplicates, which made
      # editorial disagreement indistinguishable from contract divergence: on
      # 2026-08-27 two correct parallel changes described the same
      # POST /api/reset post-state in different words and turned main red.
      #
      # The logic lives in the script so the local lane and this one cannot
      # disagree about what the check means.
      - name: Check SURFACE_SPEC has one master and intact pointers
        run: RealityEngine_CI/scripts/check-surface-specs.sh

  # ── Phase 2d: Machine corpus gates ─────────────────────────────────────────
  # RealityEngine_Machines has no workflows of its own — verification of the
  # shared corpus is owned here, like the rest of the universe. These gates are
  # fast, need no live stack, and guard the contract data every engine loads,
  # but until now they ran only on a developer laptop (jateeter/RealityEngine_Machines#44).
  corpus-gates:
    name: Corpus Gates (Machines)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # This job runs scripts from this repo (check-corpus-exit-criteria.py), so
      # it needs its own checkout as well as the corpus.
      - name: Checkout RealityEngine_CI
        uses: actions/checkout@v4

      - name: Checkout RealityEngine_Machines
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/RealityEngine_Machines
          path: RealityEngine_Machines
          token: ${{ secrets.REPO_ACCESS_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25.5'
          cache: 'npm'
          # Manager's lockfiles are in the key because these jobs now install
          # its dependencies (the prebuild below). Without them the restored
          # ~/.npm holds nothing Manager needs, so every run installs cold —
          # which is what pushed Smoke Tests past its 20-minute budget.
          cache-dependency-path: RealityEngine_Machines/package.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # ajv is what turns validate-schemas.mjs from SKIPPED into a real check.
      - name: Install corpus tooling
        working-directory: RealityEngine_Machines
        run: npm ci

      # ROBOT is what turns reason-owl from SKIPPED into a real gate. Pinned
      # deliberately: semantics/robot-report-profile.txt lists all 32 rules
      # ROBOT ships rather than expressing a delta, so a rule cannot be dropped
      # by omission — and a version bump that adds a rule surfaces as an
      # unlisted-rule difference. That protection only works if the version is
      # known. v1.9.10 is what the profile was validated against.
      - name: Install ROBOT
        run: |
          set -euo pipefail
          mkdir -p "$HOME/tools"
          curl -sSL --retry 3 --fail \
            -o "$HOME/tools/robot.jar" \
            https://github.com/ontodev/robot/releases/download/v1.9.10/robot.jar
          # Honour ROBOT_JAVA_ARGS. reason-owl.sh sets it for corpus-wide runs, whose
          # merged graph will not fit the default JVM heap; a wrapper that drops it
          # turns that into an OOM a long way from its cause.
          printf '#!/bin/bash\nexec java ${ROBOT_JAVA_ARGS:-} -jar "%s/tools/robot.jar" "$@"\n' "$HOME" > "$HOME/tools/robot"
          chmod +x "$HOME/tools/robot"
          echo "ROBOT_BIN=$HOME/tools/robot" >> "$GITHUB_ENV"
          "$HOME/tools/robot" --version

      # Schema validity, corpus index, region allocation, arbitration registry,
      # semantic-bus inventory, and OWL manifest drift across all ~1,300
      # machines — plus ROBOT report and reasoning now that ROBOT is present.
      #
      # reason-owl reports against the corpus's own profile (ERROR levels mean
      # "wrong", not "unpublished") and reasons under both ELK and HermiT. Both
      # are needed: ELK does not support functional properties and silently
      # passes a corpus violating its own escalation invariant, which HermiT
      # catches. See jateeter/RealityEngine_Machines#46.
      - name: Validate corpus
        working-directory: RealityEngine_Machines
        run: npm run validate

      # `npm run validate` reasons over one domain, which keeps the local loop
      # fast. The gate is where coverage has to be complete: all twelve domains,
      # both reasoners, ~3 minutes. Sharded rather than merged deliberately —
      # corpus-wide HermiT is 88x ELK (1,061s against 12s) and finds nothing the
      # shards do not, because the machine IRI scheme gives domains no shared
      # individuals. That is true of the corpus as it stands, not permanently, so
      # the merged run is scheduled weekly rather than dropped: see
      # .github/workflows/owl-corpus-wide.yml and
      # jateeter/RealityEngine_Machines#79.
      # The minimal provable corpus, not the whole thing.
      #
      # This reasoned over all twelve domains — 1,328 machines, ~7m30s of every
      # PR's gate — and that cost scales with the corpus. Domains, machines and
      # CES all expand at MVP, and a gate that grows with the thing it guards is
      # a gate that eventually gets switched off, which is worse than a smaller
      # one that keeps running.
      #
      # Routine validation loads the minimal provable corpus; full-corpus checks
      # run manually or on a cycle. Both reasoners run here because at 12
      # machines completeness costs ~5s, and HermiT is the one that implements
      # functional properties. All twelve domains stay in the weekly
      # owl-corpus-wide workflow alongside the corpus-wide merge.
      - name: Reason the minimal provable corpus (ELK + HermiT)
        working-directory: RealityEngine_Machines
        run: npm run owl:reason:corpus

      - name: Reason the arbiter fixtures (ELK + HermiT)
        working-directory: RealityEngine_Machines
        run: npm run owl:reason:arbiter

      # The exit criteria are a cross-repo contract, so the gate needs both
      # sides. corpus-gates saw only RealityEngine_Machines, which is exactly why
      # the corpus<->agent boundary had no gate on either side of it. Checked out
      # here rather than at the top of the job so it sits next to its only use.
      - name: Checkout localOpenClawStack
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/localOpenClawStack
          path: localOpenClawStack
          token: ${{ secrets.REPO_ACCESS_TOKEN || github.token }}

      # corpus-exit-v1.0 §3.7 states what makes a dependent regeneration correct
      # and nothing checked it. Regenerating the agent corpus produced two
      # regressions the criteria caught by hand and this catches automatically:
      # 1,328 agent specs instead of 1,323 — the arbitration fixtures must stay
      # agent-free — and axis names drifting from the corpus that owns them.
      - name: Enforce the corpus exit criteria
        run: |
          python3 scripts/check-corpus-exit-criteria.py \
            --machines RealityEngine_Machines \
            --openclaw localOpenClawStack

      # OWL semantics parity gates: regeneration determinism, vocabulary
      # closure, sequence/trigger parity, life-safety typing, RED ⇒ escalation.
      - name: Corpus contract tests
        working-directory: RealityEngine_Machines
        run: npm run test:contracts

      # A gate is only worth having if it has been seen to fail. This injects a
      # logical contradiction into a copy of the merged ontology and asserts
      # ROBOT rejects it, so a silently-degraded reasoner (wrong profile, wrong
      # reasoner, ROBOT missing) is caught here rather than by shipping an
      # inconsistent corpus that reported green.
      - name: Verify the reasoner actually rejects an inconsistency
        working-directory: RealityEngine_Machines
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          "$ROBOT_BIN" merge \
            --input semantics/ontology/re-core.ttl \
            $(for f in semantics/abox/health-personal/*.ttl; do printf -- '--input %s ' "$f"; done) \
            --output "$work/merged.owl"
          cat > "$work/contradiction.ttl" <<'TTL'
          @prefix re:  <https://realityengine.example.org/ontology/re-core#> .
          @prefix owl: <http://www.w3.org/2002/07/owl#> .
          @prefix x:   <https://realityengine.example.org/ci-negative-test#> .
          x:badDetermination a owl:NamedIndividual , re:Determination ;
              re:prescribesAction re:EmergencyDispatch ;
              re:hasRagStatus re:GREEN .
          TTL
          "$ROBOT_BIN" merge --input "$work/merged.owl" --input "$work/contradiction.ttl" \
            --output "$work/bad.owl"
          if "$ROBOT_BIN" reason --reasoner HermiT --input "$work/bad.owl" \
               --output "$work/bad-reasoned.owl" 2>"$work/err"; then
            echo "::error::The reasoner accepted a GREEN escalation determination."
            echo "::error::re-core.ttl's escalation invariant is inert — the gate proves nothing."
            exit 1
          fi
          echo "OK: the reasoner rejects a GREEN escalation determination as expected."

      # Keep the evidence. A reasoner failure is otherwise only reproducible by
      # rebuilding the merge locally.
      - name: Upload OWL artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owl-semantics
          path: |
            RealityEngine_Machines/semantics/abox-manifest.json
            RealityEngine_Machines/semantics/robot-report-profile.txt
          if-no-files-found: warn
          retention-days: 14

  # ── Phase 3: Unit tests for helper scripts ──────────────────────────────────
  scripts-unit-tests:
    name: Scripts Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout RealityEngine_CI
        uses: actions/checkout@v4
        with:
          path: RealityEngine_CI

      - name: Run registry unit tests
        working-directory: RealityEngine_CI
        run: bash scripts/tests/test-registry.sh

      - name: Run allocate-ports unit tests
        working-directory: RealityEngine_CI
        run: bash scripts/tests/test-allocate-ports.sh

      - name: Run CI e2e spec-selection unit tests
        working-directory: RealityEngine_CI
        run: bash scripts/tests/test-ci-e2e-specs.sh

      - name: Run release-manifest unit tests
        working-directory: RealityEngine_CI
        run: bash scripts/tests/test-release-manifest.sh

      - name: Run local-AI probe unit tests
        working-directory: RealityEngine_CI
        run: bash scripts/tests/test-local-ai-probe.sh

      - name: Run arbiter fixture-status unit tests
        working-directory: RealityEngine_CI
        run: bash scripts/tests/test-arbiter-fixture-status.sh

      - name: Run parity agreement unit tests
        working-directory: RealityEngine_CI
        run: bash scripts/tests/test-parity-agreement.sh

      - name: Run parity source census unit tests
        working-directory: RealityEngine_CI
        run: bash scripts/tests/test-parity-source-census.sh

      # Gates RealityEngine_CI#220 layer 1c. Fails when any site still reads or
      # writes a legacy Reality Event key. It runs from the CI checkout and
      # scans the sibling repos, so it needs them present — the same checkout
      # the parity stages already rely on.
      #
      # Wired in because an unenforced census is a claim: the failure this
      # migration produces is a reader getting an empty default and reporting
      # success, so nothing else in the suite notices a regression.
      - name: Legacy Reality Event key census
        working-directory: RealityEngine_CI
        run: python3 scripts/census-legacy-event-keys.py

      - name: Run reset contract unit tests
        working-directory: RealityEngine_CI
        run: bash scripts/tests/test-reset-contract.sh

      - name: Run push shape probe unit tests
        working-directory: RealityEngine_CI
        run: bash scripts/tests/test-push-shape-probe.sh

      - name: Run fresh-start state clearing unit tests
        working-directory: RealityEngine_CI
        run: bash scripts/tests/test-fresh-start.sh

      - name: Run observability contract unit tests
        working-directory: RealityEngine_CI
        run: bash scripts/tests/test-parity-identity.sh

      - name: Run endpoint resolver unit tests
        working-directory: RealityEngine_CI
        run: bash scripts/tests/test-resolve-endpoint.sh


      - name: Run regression comparison unit tests
        working-directory: RealityEngine_CI
        run: bash scripts/tests/test-regression-comparison.sh

      - name: Run trajectory parity unit tests
        working-directory: RealityEngine_CI
        run: bash scripts/tests/test-trajectory-parity.sh

      - name: Run corpus parity checkpoint unit tests
        working-directory: RealityEngine_CI
        run: bash scripts/tests/test-corpus-parity-checkpoint.sh

  # ── Phase 4: Dry-run pre-flight validation ──────────────────────────────────
  dry-run-validate:
    name: Dry-Run Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout RealityEngine_CI
        uses: actions/checkout@v4
        with:
          path: RealityEngine_CI

      - name: Checkout RealityEngine_Scala
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/RealityEngine_Scala
          path: RealityEngine_Scala
          token: ${{ secrets.REPO_ACCESS_TOKEN || github.token }}

      - name: Checkout RealityEngine_Manager
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/RealityEngine_Manager
          path: RealityEngine_Manager
          token: ${{ secrets.REPO_ACCESS_TOKEN || github.token }}

      - name: Checkout RealityEngine_Machines
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/RealityEngine_Machines
          path: RealityEngine_Machines
          token: ${{ secrets.REPO_ACCESS_TOKEN || github.token }}

      - name: Checkout localAIStack
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/localAIStack
          path: localAIStack
          token: ${{ secrets.REPO_ACCESS_TOKEN || github.token }}

      - name: Install Loki Docker logging plugin
        working-directory: RealityEngine_CI
        run: |
          docker plugin install grafana/loki-docker-driver:latest --alias loki --grant-all-permissions || \
            docker plugin enable loki

      - name: Install native CPP dry-run prerequisites
        run: sudo apt-get install -y libboost-dev

      - name: Run setup (env + certs)
        working-directory: RealityEngine_CI
        run: |
          cp .env.example .env
          bash certs/generate-dev-certs.sh

      - name: Dry-run — default Docker mode
        working-directory: RealityEngine_CI
        run: ./startUniverse.sh --dry-run --no-openclaw

      - name: Dry-run — multi-engine mode
        working-directory: RealityEngine_CI
        run: ./startUniverse.sh --dry-run --engines=scala:2,cpp:1 --no-openclaw

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    # Raised with the Manager prebuild: the npm work that used to happen
    # inside `Start universe` (where it blew the :3001 health poll) now
    # happens as its own step, and the job budget has to cover it. On a cold
    # npm cache that install measured 565s; the cache key now includes
    # Manager's lockfiles so repeat runs are far cheaper, but the first run
    # after a lockfile change still pays it.
    timeout-minutes: 35
    needs: [shellcheck, scripts-unit-tests, dry-run-validate]

    steps:
      - name: Checkout RealityEngine_CI
        uses: actions/checkout@v4
        with:
          path: RealityEngine_CI

      - name: Checkout RealityEngine_Scala
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/RealityEngine_Scala
          path: RealityEngine_Scala
          token: ${{ secrets.REPO_ACCESS_TOKEN || github.token }}

      - name: Checkout RealityEngine_Manager
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/RealityEngine_Manager
          path: RealityEngine_Manager
          token: ${{ secrets.REPO_ACCESS_TOKEN || github.token }}

      - name: Checkout RealityEngine_Machines
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/RealityEngine_Machines
          path: RealityEngine_Machines
          token: ${{ secrets.REPO_ACCESS_TOKEN || github.token }}

      - name: Checkout localAIStack
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/localAIStack
          path: localAIStack
          token: ${{ secrets.REPO_ACCESS_TOKEN || github.token }}

      - name: Checkout localOpenClawStack
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/localOpenClawStack
          path: localOpenClawStack
          token: ${{ secrets.REPO_ACCESS_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25.5'
          cache: 'npm'
          # Manager's lockfiles are in the key because these jobs now install
          # its dependencies (the prebuild below). Without them the restored
          # ~/.npm holds nothing Manager needs, so every run installs cold —
          # which is what pushed Smoke Tests past its 20-minute budget.
          cache-dependency-path: |
            RealityEngine_Machines/package.json
            RealityEngine_Manager/visualizer/backend/package-lock.json
            RealityEngine_Manager/visualizer/frontend/package-lock.json

      - name: Install Playwright + deps
        working-directory: RealityEngine_Machines
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Validate machine corpus
        working-directory: RealityEngine_Machines
        run: bash scripts/validate-corpus.sh

      - name: Install Loki Docker logging plugin
        working-directory: RealityEngine_CI
        run: |
          docker plugin install grafana/loki-docker-driver:latest --alias loki --grant-all-permissions || \
            docker plugin enable loki

      - name: Run setup (env + certs)
        working-directory: RealityEngine_CI
        run: |
          cp .env.example .env
          bash certs/generate-dev-certs.sh

      # Populate Manager node_modules before the universe starts.
      #
      # `RealityEngine_Manager/start.sh` runs `npm install --prefer-offline` for
      # the visualizer backend and frontend when it is launched, and
      # startUniverse polls :3001 for a bounded window. On a runner with a cold
      # npm cache that install has taken over 11 minutes — the job died with an
      # orphaned `npm install` still running — so the poll expired on an engine
      # that was never given time to start, and reported it as unreachable.
      #
      # Prebuilding here does not remove start.sh's install; it makes it a
      # no-op, because everything it would fetch is already present. The build
      # is also the same work `regression-test.sh` does in its build phase, so
      # the two lanes now agree on Manager being built before it is started.
      - name: Build Manager deployment assets
        working-directory: RealityEngine_Manager
        run: |
          for pkg in visualizer/backend visualizer/frontend; do
            echo "::group::build $pkg"
            (cd "$pkg" && npm ci --prefer-offline --no-audit --no-fund && npm run build)
            echo "::endgroup::"
          done

      - name: Start universe
        working-directory: RealityEngine_CI
        env:
          MACHINES_DIR: ${{ github.workspace }}/RealityEngine_Machines
          SCALA_DIR: ${{ github.workspace }}/RealityEngine_Scala
          MGR_DIR: ${{ github.workspace }}/RealityEngine_Manager
        run: ./startUniverse.sh --no-openclaw --no-local-ai --skip-seed --machine-corpus=regression

      - name: Run smoke tests
        working-directory: RealityEngine_Machines
        env:
          REUSE_SERVICES: 'true'
          SKIP_GLOBAL_SETUP: 'true'
        run: npx playwright test tests/smoke --reporter=list --grep-invert "localAIStack API /health"

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: RealityEngine_Machines/e2e-report/
          retention-days: 7

      - name: Stop universe
        if: always()
        working-directory: RealityEngine_CI
        run: ./stopUniverse.sh

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: smoke-tests

    steps:
      - name: Checkout RealityEngine_CI
        uses: actions/checkout@v4
        with:
          path: RealityEngine_CI

      - name: Checkout RealityEngine_Scala
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/RealityEngine_Scala
          path: RealityEngine_Scala
          token: ${{ secrets.REPO_ACCESS_TOKEN || github.token }}

      - name: Checkout RealityEngine_Manager
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/RealityEngine_Manager
          path: RealityEngine_Manager
          token: ${{ secrets.REPO_ACCESS_TOKEN || github.token }}

      - name: Checkout RealityEngine_Machines
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/RealityEngine_Machines
          path: RealityEngine_Machines
          token: ${{ secrets.REPO_ACCESS_TOKEN || github.token }}

      - name: Checkout localAIStack
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/localAIStack
          path: localAIStack
          token: ${{ secrets.REPO_ACCESS_TOKEN || github.token }}

      - name: Checkout localOpenClawStack
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/localOpenClawStack
          path: localOpenClawStack
          token: ${{ secrets.REPO_ACCESS_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25.5'
          cache: 'npm'
          # Manager's lockfiles are in the key because these jobs now install
          # its dependencies (the prebuild below). Without them the restored
          # ~/.npm holds nothing Manager needs, so every run installs cold —
          # which is what pushed Smoke Tests past its 20-minute budget.
          cache-dependency-path: |
            RealityEngine_Machines/package.json
            RealityEngine_Manager/visualizer/backend/package-lock.json
            RealityEngine_Manager/visualizer/frontend/package-lock.json

      - name: Install Playwright + deps
        working-directory: RealityEngine_Machines
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Install Loki Docker logging plugin
        working-directory: RealityEngine_CI
        run: |
          docker plugin install grafana/loki-docker-driver:latest --alias loki --grant-all-permissions || \
            docker plugin enable loki

      - name: Run setup (env + certs)
        working-directory: RealityEngine_CI
        run: |
          cp .env.example .env
          bash certs/generate-dev-certs.sh

      # Populate Manager node_modules before the universe starts.
      #
      # `RealityEngine_Manager/start.sh` runs `npm install --prefer-offline` for
      # the visualizer backend and frontend when it is launched, and
      # startUniverse polls :3001 for a bounded window. On a runner with a cold
      # npm cache that install has taken over 11 minutes — the job died with an
      # orphaned `npm install` still running — so the poll expired on an engine
      # that was never given time to start, and reported it as unreachable.
      #
      # Prebuilding here does not remove start.sh's install; it makes it a
      # no-op, because everything it would fetch is already present. The build
      # is also the same work `regression-test.sh` does in its build phase, so
      # the two lanes now agree on Manager being built before it is started.
      - name: Build Manager deployment assets
        working-directory: RealityEngine_Manager
        run: |
          for pkg in visualizer/backend visualizer/frontend; do
            echo "::group::build $pkg"
            (cd "$pkg" && npm ci --prefer-offline --no-audit --no-fund && npm run build)
            echo "::endgroup::"
          done

      - name: Start universe
        working-directory: RealityEngine_CI
        env:
          MACHINES_DIR: ${{ github.workspace }}/RealityEngine_Machines
          SCALA_DIR: ${{ github.workspace }}/RealityEngine_Scala
          MGR_DIR: ${{ github.workspace }}/RealityEngine_Manager
        run: ./startUniverse.sh --no-openclaw --no-local-ai --machine-corpus=regression

      - name: Run integration tests
        working-directory: RealityEngine_Machines
        env:
          REUSE_SERVICES: 'true'
          SKIP_GLOBAL_SETUP: 'true'
        run: |
          npx playwright test \
            tests/integration/corpus-integrity.spec.ts \
            tests/integration/openclaw-health.spec.ts \
            --reporter=list

      - name: Run e2e tests
        working-directory: RealityEngine_Machines
        env:
          REUSE_SERVICES: 'true'
          SKIP_GLOBAL_SETUP: 'true'
        run: npx playwright test tests/e2e --reporter=list

      # The canonical app-level specs live in RealityEngine_CI/e2e/tests/ and
      # had no hosted execution path (see #78). This job runs the Docker
      # universe, which is the shape those specs target — they resolve
      # https://localhost:5001 (RE) and :3004 (PE) directly.
      #
      # Chromium is already installed system-wide by the Playwright step above.
      - name: Install CI Playwright deps
        working-directory: RealityEngine_CI
        run: npm ci

      # This job runs a single-engine Docker universe, so it runs exactly the
      # specs that target that shape. The multi-engine spec
      # (tree-to-pe-manager-equivalence) needs engines this job never spawns —
      # it asked for lsp-1 and got a 404. scripts/lib/ci-e2e-specs.sh is the
      # single source of truth for that split; it runs in
      # multi-engine-and-parity-tests.
      - name: Run CI e2e suite (single-engine specs)
        working-directory: RealityEngine_CI
        env:
          REUSE_SERVICES: 'true'
          PLAYWRIGHT_BASE_URL: 'https://localhost:5173'
        run: |
          . scripts/lib/ci-e2e-specs.sh
          specs="$(ci_e2e_single_engine_specs | tr '\n' ' ')"
          echo "Running single-engine specs: $specs"
          # shellcheck disable=SC2086
          npx playwright test $specs --project=chromium --workers=1 --reporter=list

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            RealityEngine_Machines/e2e-report/
            RealityEngine_Machines/e2e-results.json
            RealityEngine_Machines/test-results/
          retention-days: 30

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-screenshots
          path: RealityEngine_Machines/test-results/**/screenshots/
          retention-days: 7

      - name: Show logs on failure
        if: failure()
        working-directory: RealityEngine_CI
        run: |
          echo "=== Reality Engine ==="
          docker compose logs reality-engine --tail=50
          echo "=== Perception Engine ==="
          docker compose logs perception-engine-backend --tail=30
          echo "=== Visualizer Backend ==="
          docker compose logs visualizer-backend --tail=30
          echo "=== localAIStack API ==="
          docker logs localai_api --tail=30 2>/dev/null || true
          echo "=== Corpus seed log ==="
          cat /tmp/corpus_seed.log 2>/dev/null || true

      - name: Stop universe
        if: always()
        working-directory: RealityEngine_CI
        run: ./stopUniverse.sh

  # ── Multi-engine + tri-runtime parity, shared core ─────────────────────────
  # Both gates used to boot their own universe from scratch (multi-engine-tests
  # via `--engines=scala:2`, tri-runtime-parity via `--engines=cpp:1,lsp:1,scala:1`)
  # — two full checkouts, two native toolchain installs, two Manager builds, two
  # `startUniverse.sh` bring-ups. Merged into one job, one boot:
  # `--engines=cpp:2,scala:1,lsp:1` registers cpp-1, cpp-2, scala-1, lsp-1 in a
  #
  # THE ORDER IS LOAD-BEARING, not cosmetic. `multi-instance.spec.ts` selects its
  # pair positionally — `const [a, b] = instances` — and registry order is spawn
  # order is the order of this flag (`registry_add` appends; startUniverse walks
  # the spec list left to right). With cpp second and third, `instances[0..1]`
  # was scala-1 and lsp-1: a CROSS-runtime pair, for a step named "cpp-1 + cpp-2".
  # It passed anyway — the test only asserts both endpoints return an array, and
  # its own comment says "state may differ (different runtimes / seeds)".
  #
  # The doubled family therefore comes first. This restores the intent; it does
  # not remove the fragility, which is that a spec selects by position. Tracked
  # as RealityEngine_CI#274.
  # single registry, and every gate below is reallocated onto that one pool
  # instead of re-deploying it.
  #
  # Engine counts do not drive boot time here — corpus size does, and both
  # prior jobs already booted the same 12-machine standard-deployment subset.
  # This job boots standard-deployment-plus-ring instead (the same 12 plus the
  # 2-machine RS-latch ring, see config/standard-deployment-plus-ring-corpus.txt)
  # for every instance, so the propagation proof rides along by default rather
  # than opt-in. cpp is doubled rather than scala: cpp was observed ready in
  # ~84s against Scala's up-to-450s (JVM boot contending with Loki/Grafana/
  # Prometheus on a shared runner) — the doubled family is the cheapest one to
  # form, not the most expensive.
  #
  # Allocation:
  #   multi-engine-tests' same-runtime comparison: cpp-1 + cpp-2 (was scala-1 +
  #     scala-2 — functionally equivalent, the gate only needs two instances of
  #     one runtime family, and cpp is the doubled one now).
  #   tri-runtime-parity: cpp-1 + lsp-1 + scala-1, unchanged — this is the set
  #     tree-to-pe-manager-equivalence.spec.ts hardcodes and cannot substitute.
  #
  # No reset step runs between the two gate sections below: both drew against
  # one boot in the pre-merge tri-runtime-parity job already (its byte-
  # equivalence and corpus-addressing steps ran back to back with no reset),
  # so sequencing the multi-engine gate ahead of the parity gate against the
  # same boot follows existing, working precedent rather than a new one.
  # scripts/regression-reset-contract.py is NOT that reset primitive — it is a
  # settled-contract conformance stage that fails by design against today's
  # engines (RealityEngine_CI#163), not a general reset utility.
  #
  # Known gap this merge does NOT close: smoke-tests and e2e-tests still boot
  # their own Docker-mode universe. Their Playwright specs (RealityEngine_
  # Machines' tests/smoke, tests/integration, tests/e2e) hardcode the Docker
  # TLS endpoints (https://localhost:5001 RE, :3004 PE) and are explicitly not
  # registry-aware (see scripts/lib/ci-e2e-specs.sh) — only
  # tree-to-pe-manager-equivalence.spec.ts is allowlisted as multi-engine safe.
  # Folding them onto this native core would need spec changes in
  # RealityEngine_Machines, a repo not present in this checkout, so it is left
  # as follow-up work rather than attempted blind here.
  multi-engine-and-parity-tests:
    name: Multi-Engine & Tri-Runtime Parity (shared core)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Previously 45 (multi-engine-tests) + 90 (tri-runtime-parity) = 135 across
    # two jobs with two full bring-ups. One shared bring-up should cost less
    # than either bring-up alone plus the combined gate time; 120 leaves
    # headroom without carrying the old double-boot budget forward unexamined.
    timeout-minutes: 120
    needs: smoke-tests

    steps:
      - name: Checkout RealityEngine_CI
        uses: actions/checkout@v4
        with:
          path: RealityEngine_CI

      - name: Checkout RealityEngine_Scala
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/RealityEngine_Scala
          path: RealityEngine_Scala
          token: ${{ secrets.REPO_ACCESS_TOKEN || github.token }}

      - name: Checkout RealityEngine_CPP
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/RealityEngine_CPP
          path: RealityEngine_CPP
          token: ${{ secrets.REPO_ACCESS_TOKEN || github.token }}

      - name: Checkout RealityEngine_LSP
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/RealityEngine_LSP
          path: RealityEngine_LSP
          token: ${{ secrets.REPO_ACCESS_TOKEN || github.token }}

      - name: Checkout RealityEngine_Manager
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/RealityEngine_Manager
          path: RealityEngine_Manager
          token: ${{ secrets.REPO_ACCESS_TOKEN || github.token }}

      - name: Checkout RealityEngine_Machines
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/RealityEngine_Machines
          path: RealityEngine_Machines
          token: ${{ secrets.REPO_ACCESS_TOKEN || github.token }}

      - name: Checkout localAIStack
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/localAIStack
          path: localAIStack
          token: ${{ secrets.REPO_ACCESS_TOKEN || github.token }}

      - name: Checkout localOpenClawStack
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/localOpenClawStack
          path: localOpenClawStack
          token: ${{ secrets.REPO_ACCESS_TOKEN || github.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25.5'
          cache: 'npm'
          # Manager's lockfiles are in the key because these jobs now install
          # its dependencies (the prebuild below). Without them the restored
          # ~/.npm holds nothing Manager needs, so every run installs cold —
          # which is what pushed Smoke Tests past its 20-minute budget.
          cache-dependency-path: |
            RealityEngine_Machines/package.json
            RealityEngine_Manager/visualizer/backend/package-lock.json
            RealityEngine_Manager/visualizer/frontend/package-lock.json

      # ── cpp toolchain ──────────────────────────────────────────────────────
      # g++ is preinstalled. The engine links OpenSSL (-lssl -lcrypto) and
      # includes boost/asio.hpp. libboost-dev is enough: LDFLAGS carries no
      # -lboost_*, so only the headers are needed, not the compiled libraries.
      # ── lsp toolchain: SBCL from apt; Quicklisp bootstrapped below ─────────
      - name: Install native toolchains (OpenSSL, Boost, SBCL)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libssl-dev libboost-dev sbcl
          g++ --version | head -1
          sbcl --version
          echo "boost/asio.hpp: $(ls /usr/include/boost/asio.hpp 2>/dev/null || echo MISSING)"

      - name: Setup Java for native Scala engines
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup sbt for native Scala engines
        run: |
          curl -fsSL https://github.com/sbt/sbt/releases/download/v1.12.8/sbt-1.12.8.tgz -o /tmp/sbt-1.12.8.tgz
          sudo tar -xzf /tmp/sbt-1.12.8.tgz -C /opt
          echo "/opt/sbt/bin" >> "$GITHUB_PATH"

      # RealityEngine_LSP/quicklisp/ is gitignored, so a fresh checkout has none
      # and start.sh exits with "Missing Quicklisp". Cached on the ASDF system
      # definition, since that is what determines the dependency set.
      - name: Cache Quicklisp
        uses: actions/cache@v4
        with:
          path: RealityEngine_LSP/quicklisp
          key: quicklisp-${{ runner.os }}-${{ hashFiles('RealityEngine_LSP/reality-engine-lsp.asd') }}
          restore-keys: quicklisp-${{ runner.os }}-

      - name: Bootstrap Quicklisp
        working-directory: RealityEngine_LSP
        run: bash scripts/bootstrap-quicklisp.sh

      - name: Install Playwright + deps (Machines)
        working-directory: RealityEngine_Machines
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # tree-to-pe-manager-equivalence lives in this repo's canonical suite.
      - name: Install Playwright deps (CI)
        working-directory: RealityEngine_CI
        run: npm ci

      - name: Install Loki Docker logging plugin
        working-directory: RealityEngine_CI
        run: |
          docker plugin install grafana/loki-docker-driver:latest --alias loki --grant-all-permissions || \
            docker plugin enable loki

      - name: Run setup (env + certs)
        working-directory: RealityEngine_CI
        run: |
          cp .env.example .env
          bash certs/generate-dev-certs.sh

      # Populate Manager node_modules before the universe starts.
      #
      # `RealityEngine_Manager/start.sh` runs `npm install --prefer-offline` for
      # the visualizer backend and frontend when it is launched, and
      # startUniverse polls :3001 for a bounded window. On a runner with a cold
      # npm cache that install has taken over 11 minutes — the job died with an
      # orphaned `npm install` still running — so the poll expired on an engine
      # that was never given time to start, and reported it as unreachable.
      #
      # Prebuilding here does not remove start.sh's install; it makes it a
      # no-op, because everything it would fetch is already present. The build
      # is also the same work `regression-test.sh` does in its build phase, so
      # the two lanes now agree on Manager being built before it is started.
      - name: Build Manager deployment assets
        working-directory: RealityEngine_Manager
        run: |
          for pkg in visualizer/backend visualizer/frontend; do
            echo "::group::build $pkg"
            (cd "$pkg" && npm ci --prefer-offline --no-audit --no-fund && npm run build)
            echo "::endgroup::"
          done

      # The one shared bring-up, on the regression corpus.
      #
      # `regression` is a first-class --machine-corpus= mode that selects its own
      # manifest, so this names one corpus instead of a mode plus a path. It is
      # standard-deployment's twelve plus the RS ring pair (propagation) and
      # ArbitrationWriterA/B + Reader — the only machines here that make a cell
      # contended, and a contended cell is the only condition under which the
      # arbiter runs. standard-deployment writes 40 cells and none has two
      # writers, so this gate previously ran where arbitration could not be
      # observed (RealityEngine_CI#274).
      - name: Start shared multi-engine core (scala:1,lsp:1,cpp:2)
        working-directory: RealityEngine_CI
        env:
          MACHINES_DIR: ${{ github.workspace }}/RealityEngine_Machines
          SCALA_DIR: ${{ github.workspace }}/RealityEngine_Scala
          MGR_DIR: ${{ github.workspace }}/RealityEngine_Manager
          # Sized for the slowest single member (Scala, observed needing up to
          # 450s against Loki/Grafana/Prometheus contention on a shared
          # runner) — unchanged from the prior tri-runtime-parity budget,
          # since that is still the binding constraint here.
          NATIVE_HEALTH_ATTEMPTS: '450'
          HOST_IP_OVERRIDE: 127.0.0.1
        run: |
          ./startUniverse.sh --no-openclaw --no-local-ai --skip-seed \
            --machine-corpus=regression \
            --engines=cpp:2,scala:1,lsp:1

      - name: Show registry
        if: always()
        run: |
          echo "=== registry ==="
          cat /tmp/re-registry/re-registry.json 2>/dev/null || echo "no registry"

      # ── Gate: multi-engine (same-runtime comparison) ───────────────────────
      # Reallocated onto cpp-1 + cpp-2 (was scala-1 + scala-2 under the old
      # --engines=scala:2 boot).
      #
      # The spec does NOT discover a same-runtime pair. multi-instance.spec.ts
      # takes `const [a, b] = instances` — the first two in registry order — so
      # which pair it compares is decided by the order of the --engines= flag
      # above. That is why cpp comes first there, and why the order is
      # load-bearing rather than cosmetic.
      #
      # An earlier note here recorded this as an unverified risk that the spec
      # might assume "scala" by name. It was verified: there is no "scala"
      # string in it. The assumption that bites is positional, not nominal — and
      # it does not fail loudly, because the test asserts only that both
      # endpoints return an array. Selecting by the registry's `runtime` field
      # is the durable fix; tracked as RealityEngine_CI#274.
      - name: Run multi-instance integration tests (cpp-1 + cpp-2)
        working-directory: RealityEngine_Machines
        env:
          REUSE_SERVICES: 'true'
          RE_REGISTRY_URL: 'http://localhost:5999/re-registry.json'
          VIZ_BASE_URL: 'http://127.0.0.1:3001'
        run: |
          npx playwright test tests/integration/multi-instance.spec.ts \
            --reporter=list

      # Cross-runtime contract specs. These were dropped from the hosted
      # allowlist in the e2e job (#77) even though none of them touch localAI;
      # they belong here because this is the job with a registry.
      #
      # They are skip-safe by design, so a run where all of them skip must fail
      # — otherwise this step reports success while enforcing nothing, which is
      # the exact failure mode #78/#79 were about.
      #
      # The token is read from the file startUniverse persists, not pinned here.
      # Ingest auth is on by default, so an unset token gets 401 — and so does a
      # pinned one, because the value the PE ends up with depends on precedence
      # between the flag, the environment and the generated file. Reading what
      # the universe actually wrote is the only version that cannot drift, same
      # reasoning as MACHINES_CORPUS_DIR below.
      - name: Run cross-runtime contract specs
        working-directory: RealityEngine_Machines
        env:
          REUSE_SERVICES: 'true'
          RE_REGISTRY_URL: 'http://localhost:5999/re-registry.json'
          VIZ_BASE_URL: 'http://127.0.0.1:3001'
          INTEGRATIONS_CONFIG: ${{ github.workspace }}/RealityEngine_CI/config/integrations.json
          PLAYWRIGHT_JSON_OUTPUT_NAME: contract-results.json
        run: |
          stamp="${{ github.workspace }}/RealityEngine_CI/.universe-engine-selection"
          # machine-json-listing compares json/list against the corpus the
          # universe actually booted — standard-deployment-plus-ring here, not
          # the repo's full tree.
          MACHINES_CORPUS_DIR="$(sed -n 's/^MACHINE_CORPUS_ACTIVE_DIR=//p' "$stamp" 2>/dev/null)"
          export MACHINES_CORPUS_DIR
          echo "Active corpus: ${MACHINES_CORPUS_DIR:-<repo default>}"

          token_file="${{ github.workspace }}/RealityEngine_CI/config/.healthkit-bridge-token"
          if [ -s "$token_file" ]; then
            HEALTHKIT_BRIDGE_TOKEN="$(tr -d '\r\n' < "$token_file")"
            export HEALTHKIT_BRIDGE_TOKEN
            echo "HealthKit ingest auth: token loaded (${#HEALTHKIT_BRIDGE_TOKEN} chars)"
          else
            echo "HealthKit ingest auth: no token file — auth arm will self-skip"
          fi

          pw_exit=0
          npx playwright test \
            tests/integration/healthkit-ingest-contract.spec.ts \
            tests/integration/machine-json-listing.spec.ts \
            tests/integration/pe-source-lane-compliance.spec.ts \
            --reporter=list,json || pw_exit=$?

          node -e '
            const fs = require("fs");
            const f = "contract-results.json";
            if (!fs.existsSync(f)) {
              console.error("::error::no Playwright JSON report — cannot prove these specs ran");
              process.exit(1);
            }
            const s = JSON.parse(fs.readFileSync(f, "utf8")).stats || {};
            const ran = (s.expected || 0) + (s.unexpected || 0) + (s.flaky || 0);
            console.log(`executed=${ran} skipped=${s.skipped || 0}`);
            if (ran === 0) {
              console.error("::error::every cross-runtime contract spec skipped — " +
                "this step enforced nothing. Check RE_REGISTRY_URL, the registry, " +
                "and INTEGRATIONS_CONFIG.");
              process.exit(1);
            }
          '
          exit "$pw_exit"

      # ── Gate: tri-runtime parity (cpp-1 + lsp-1 + scala-1) ─────────────────
      # Byte equivalence is only meaningful across *distinct* runtimes, so the
      # cpp-1/cpp-2 pair above cannot substitute here: it would compare cpp-1
      # to cpp-2. tree-to-pe-manager-equivalence.spec.ts hardcodes lsp-1,
      # scala-1 and cpp-1 — the gap left open in #77/#80.
      #
      # The prize: byte equivalence across three distinct runtimes. This spec
      # self-skips when the registry lacks cpp-1/lsp-1/scala-1, so the step
      # asserts it actually executed rather than trusting a green exit.
      # continue-on-error covers only pre-existing product drift, not the
      # skip: the guard below still fails hard when the spec does not execute,
      # so this step cannot silently no-op. The first run of this spec — ever,
      # in any environment — found six endpoints whose bytes differ across
      # cpp/lsp/scala while all return 200. Fixing that means changing
      # serialization in three engines and deciding which is canonical, so it
      # is tracked in #91 rather than blocking this job from landing.
      # The flag comes off when #91 closes.
      - name: Byte-equivalence parity across runtimes
        continue-on-error: true
        working-directory: RealityEngine_CI
        env:
          REUSE_SERVICES: 'true'
          MULTI_ENGINE_E2E: 'true'
          PLAYWRIGHT_BASE_URL: 'http://localhost:5173'
          PLAYWRIGHT_JSON_OUTPUT_NAME: tri-runtime-results.json
        run: |
          pw_exit=0
          npx playwright test e2e/tests/tree-to-pe-manager-equivalence.spec.ts \
            --project=chromium --workers=1 --reporter=list,json || pw_exit=$?

          node -e '
            const fs = require("fs");
            const f = "tri-runtime-results.json";
            if (!fs.existsSync(f)) {
              console.error("::error::no Playwright JSON report — the parity spec did not run");
              process.exit(1);
            }
            const s = JSON.parse(fs.readFileSync(f, "utf8")).stats || {};
            const ran = (s.expected || 0) + (s.unexpected || 0) + (s.flaky || 0);
            console.log(`executed=${ran} skipped=${s.skipped || 0}`);
            if (ran === 0) {
              console.error("::error::the tri-runtime parity spec skipped — this job " +
                "spawned a universe for nothing. Check that cpp-1, lsp-1 and scala-1 " +
                "are all in the registry.");
              process.exit(1);
            }
          '
          exit "$pw_exit"

      # Corpus addressing across three runtimes rather than two of the same.
      - name: Corpus addressing parity across runtimes
        working-directory: RealityEngine_Machines
        env:
          REUSE_SERVICES: 'true'
          RE_REGISTRY_URL: 'http://localhost:5999/re-registry.json'
          VIZ_BASE_URL: 'http://127.0.0.1:3001'
        run: |
          stamp="${{ github.workspace }}/RealityEngine_CI/.universe-engine-selection"
          MACHINES_CORPUS_DIR="$(sed -n 's/^MACHINE_CORPUS_ACTIVE_DIR=//p' "$stamp" 2>/dev/null)"
          export MACHINES_CORPUS_DIR
          echo "Active corpus: ${MACHINES_CORPUS_DIR:-<repo default>}"
          npx playwright test tests/integration/machine-json-listing.spec.ts \
            --project=chromium --workers=1 --reporter=list

      - name: Upload multi-engine and parity artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: multi-engine-parity-report
          path: |
            RealityEngine_Machines/e2e-report/
            RealityEngine_Machines/test-results/
            RealityEngine_Machines/contract-results.json
            RealityEngine_CI/tri-runtime-results.json
            RealityEngine_CI/e2e-report/
            RealityEngine_CI/test-results/
          retention-days: 14

      - name: Show registry and engine logs on failure
        if: failure()
        run: |
          echo "=== Registry ==="
          cat /tmp/re-registry/re-registry.json 2>/dev/null || echo "No registry"
          echo "=== Manager launcher ==="
          tail -120 /tmp/manager_universe.log 2>/dev/null || echo "No manager launcher log"
          for f in RealityEngine_Manager/.manager-logs/*.log; do
            [ -f "$f" ] && { echo "--- $f ---"; tail -120 "$f"; } || true
          done
          for f in /tmp/re-*.log /tmp/pe-*.log; do
            [ -f "$f" ] && { echo "--- $f ---"; tail -20 "$f"; } || true
          done
          echo "=== LSP engine logs ==="
          for f in RealityEngine_LSP/logs/*.log; do
            [ -f "$f" ] && { echo "--- $f ---"; tail -60 "$f"; } || true
          done

      - name: Stop shared multi-engine core
        if: always()
        working-directory: RealityEngine_CI
        run: ./stopUniverse.sh --engines-only 2>/dev/null || ./stopUniverse.sh --all || true

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [shellcheck, dockerfile-security, surface-spec-drift, corpus-gates, scripts-unit-tests, dry-run-validate, smoke-tests, e2e-tests, multi-engine-and-parity-tests]
    if: always()

    steps:
      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
        continue-on-error: true

      - name: Publish test summary
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const resultsPath = 'RealityEngine_Machines/e2e-results.json';
            if (fs.existsSync(resultsPath)) {
              const results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
              const total  = results.suites?.reduce((a, s) => a + s.specs.length, 0) ?? 0;
              const passed = results.suites?.reduce((a, s) => a + s.specs.filter(sp => sp.ok).length, 0) ?? 0;
              const failed = total - passed;
              const dur    = ((results.stats?.duration ?? 0) / 1000).toFixed(2);
              core.summary.addRaw(`
            ## E2E Test Results (RealityEngine Universe)
            | Metric | Value |
            |---|---|
            | Total | ${total} |
            | Passed | ${passed} |
            | Failed | ${failed} |
            | Duration | ${dur}s |
              `).write();
            }
