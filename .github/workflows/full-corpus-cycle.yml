name: Full Corpus Cycle

# The whole-corpus sweep the per-PR gates deliberately do not run.
#
# `corpus-gates` in e2e-tests.yml validates the corpus on every PR, and the
# regression lanes boot the 20-machine selection in
# config/regression-corpus.txt. Neither exercises the other 1,308 machines
# against a live runtime, so a defect that only a particular machine shape
# provokes has no scheduled opportunity to surface.
#
# Weekly, decided 2026-09-25. The regression-test corpus
# (config/regression-corpus.txt) is the corpus of interest and is gated on every
# regression run. The full corpus, including the full 1,323-spec OpenClaw agent
# corpus, is constructed once per week, here (localOpenClawStack CLAUDE.md,
# "Which agent corpus matters"; #467). This replaces the every-5th-day cron, whose
# case was that domains were landing fast. A real period also removes the 1-5 day
# gap `*/5` produced across month boundaries. If domains start arriving faster
# than weekly again, raise the frequency here, on purpose, and say why.
#
# The agent corpus is constructed here and nowhere else on a schedule. On
# 2026-09-25 it was found five weeks behind the machine corpus (it predated the
# RealityEngine_Machines#154 action changes) while every gate passed. The
# count/join/axis gate cannot see stale actions, and nothing rebuilt the specs to
# compare. The agent-corpus job below rebuilds them from the current corpus and
# fails when the committed specs differ.
#
# NOT here, deliberately: recording the CES contract across the full corpus.
# scripts/regression-ces-contracts.py documents why — the full corpus yields
# 4,941 chains against the regression selection's 35, ~8.2h against ~4min, which
# exceeds a hosted runner's 6h job limit and produces a diff no reviewer can
# read. Making that a scheduled job requires sharding the record by domain and
# merging the shards, which is its own piece of work. This workflow answers the
# question that does not need it: does the full corpus still validate, and does
# every runtime still load all of it.

on:
  schedule:
    # 05:00 UTC every Sunday. Clear of the 07:00 Monday owl-corpus-wide run and
    # the 09:17 regression cron, so three long jobs do not contend for runners.
    - cron: '0 5 * * 0'
  workflow_dispatch:
    inputs:
      machines_ref:
        description: 'RealityEngine_Machines ref (branch, tag or SHA). Empty = default branch.'
        required: false
        default: ''
      openclaw_ref:
        description: 'localOpenClawStack ref whose committed agent corpus is checked. Empty = default branch.'
        required: false
        default: ''
      file_issue:
        description: 'File/update a GitHub issue when the sweep finds drift'
        required: false
        type: boolean
        default: true

concurrency:
  group: full-corpus-cycle
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  # ── Static sweep: every generator, every domain, all 1328 machines ────────
  # No runtime needed. This is validate-corpus.sh over the whole corpus, which
  # since RealityEngine_Machines#(inventory) also runs the generator inventory
  # gate — so a domain that arrives with an unwired generator fails here rather
  # than going unnoticed until something downstream reads a stale artifact.
  corpus-static:
    name: Full corpus — generators, schemas, OWL, inventory
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      verdict: ${{ steps.sweep.outcome }}
    steps:
      - name: Checkout RealityEngine_CI
        uses: actions/checkout@v7
        with:
          path: RealityEngine_CI

      - name: Checkout RealityEngine_Machines
        uses: actions/checkout@v7
        with:
          repository: jateeter/RealityEngine_Machines
          ref: ${{ github.event.inputs.machines_ref || '' }}
          path: RealityEngine_Machines

      # A corpus selection may name machines this repo does not own. The
      # regression scope draws rag_corrective_cycle, session_rag_context and
      # session_agent_context from localAIStack, so without it checked out
      # alongside those three do not resolve, the scope silently shrinks from 21
      # machines to 18, and build-ces-contract-registry declines to do the full
      # check rather than report a registry as stale that is not.
      #
      # Checked out as a SIBLING of RealityEngine_Machines, because that is how
      # the script finds it: LOCAL_AI_MACHINES is REPO_ROOT.parent /
      # "localAIStack" / "data" / "machines". Only the corpus is wanted, but a
      # sparse checkout would couple this workflow to that repo's layout, so the
      # whole repo is taken.
      - name: Checkout localAIStack (corpus root for cross-repo selections)
        uses: actions/checkout@v7
        with:
          repository: jateeter/localAIStack
          path: localAIStack

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.8'

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # rdflib and pyshacl are what let extract-qudt-subset.py and
      # validate-guardrails.sh actually run. Without them validate-corpus.sh
      # skips both with a notice — which is correct for a developer laptop and
      # wrong for the sweep whose entire purpose is completeness.
      - name: Install corpus tooling
        run: |
          python3 -m pip install --quiet rdflib pyshacl
          cd RealityEngine_Machines && npm ci --no-audit --no-fund

      - name: Install ROBOT (OWL reasoner)
        run: |
          mkdir -p "$HOME/robot"
          curl -fsSL -o "$HOME/robot/robot.jar" \
            https://github.com/ontodev/robot/releases/download/v1.9.6/robot.jar
          printf '#!/usr/bin/env bash\nexec java -jar "%s/robot.jar" "$@"\n' "$HOME/robot" \
            > "$HOME/robot/robot"
          chmod +x "$HOME/robot/robot"
          echo "$HOME/robot" >> "$GITHUB_PATH"

      # validate-corpus.sh reads the QUDT vocabulary from
      # RealityEngine_Machines/.qudt-cache, which is gitignored — so it is
      # absent on every fresh checkout and the unit-vocabulary gate skipped on
      # every scheduled run this workflow has ever made. Installing rdflib above
      # is necessary and was not sufficient.
      #
      # The key carries the pinned version rather than a literal, because
      # bumping QUDT_VERSION is a contract change: a fixed key would serve the
      # old vocabulary to a corpus validated against the new one, which is a
      # stale artifact reading as a fresh one.
      - name: Resolve the pinned QUDT version
        id: qudt
        working-directory: RealityEngine_Machines
        run: |
          version="$(sed -n 's/^QUDT_VERSION = "\([^"]*\)".*/\1/p' scripts/extract-qudt-subset.py)"
          if [ -z "$version" ]; then
            echo "::error::could not read QUDT_VERSION from scripts/extract-qudt-subset.py"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache the QUDT vocabulary
        id: qudt-cache
        uses: actions/cache@v4
        with:
          path: RealityEngine_Machines/.qudt-cache
          key: qudt-${{ steps.qudt.outputs.version }}

      # --download prints SKIPPED and exits 0 when the fetch fails, which is
      # right for a laptop and wrong here: it would hand the sweep an empty
      # cache and the skip would surface one step later as a sweep that covered
      # less than it claims. So the fetch asserts it actually landed.
      - name: Fetch the QUDT vocabulary
        if: steps.qudt-cache.outputs.cache-hit != 'true'
        working-directory: RealityEngine_Machines
        run: |
          bash scripts/extract-qudt-subset.sh --source "$PWD/.qudt-cache" --download --check
          if [ -z "$(ls -A .qudt-cache 2>/dev/null)" ]; then
            echo "::error::QUDT fetch produced nothing — the sweep would skip its unit-vocabulary gate"
            exit 1
          fi

      - name: Full corpus sweep
        id: sweep
        working-directory: RealityEngine_Machines
        run: |
          set -o pipefail
          bash scripts/validate-corpus.sh 2>&1 | tee "$GITHUB_WORKSPACE/full-corpus-sweep.log"

      # The sweep skipping a check is a finding, not a pass. validate-corpus.sh
      # degrades gracefully when a tool is missing so a laptop run still does
      # something useful; here a SKIPPED line means the sweep did not cover what
      # it claims to, which is exactly the "absence reads as success" failure
      # this cycle exists to catch.
      - name: Assert nothing was skipped
        if: always() && steps.sweep.outcome == 'success'
        run: |
          if grep -q "SKIPPED" "$GITHUB_WORKSPACE/full-corpus-sweep.log"; then
            echo "::error::Full corpus sweep skipped checks — it did not cover what it reports:"
            grep "SKIPPED" "$GITHUB_WORKSPACE/full-corpus-sweep.log"
            exit 1
          fi
          echo "No checks skipped — the sweep covered the whole corpus."

      - name: Upload sweep log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-corpus-sweep-log
          path: full-corpus-sweep.log
          retention-days: 30

  # ── Load parity: every runtime loads the whole corpus, and agrees ────────
  # Nothing raises when an engine silently fails to read part of the corpus, so
  # agreement on the load count across runtimes is the only check that catches
  # it (this is the lesson recorded from the Reality Event rename, CI#220, and
  # the gap #356 names: scala held 1344 to cpp/lsp's 1338 unnoticed).
  corpus-load-parity:
    name: Full corpus — per-runtime load count parity
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Sequenced after the static sweep so two long jobs do not contend for
    # runners, but NOT conditional on it. These answer different questions —
    # "does the corpus still validate" and "does every runtime still load all of
    # it" — and only the second can catch a runtime silently dropping a machine
    # shape.
    #
    # On 2026-09-16 a missing vocabulary file failed the static sweep and this
    # job did not run at all, so the sweep that exists to check the whole corpus
    # answered neither question. The cheaper check must not be able to suppress
    # the more valuable one.
    needs: corpus-static
    if: always()
    steps:
      - name: Checkout RealityEngine_CI
        uses: actions/checkout@v7
        with:
          path: RealityEngine_CI

      - name: Checkout RealityEngine_Machines
        uses: actions/checkout@v7
        with:
          repository: jateeter/RealityEngine_Machines
          ref: ${{ github.event.inputs.machines_ref || '' }}
          path: RealityEngine_Machines

      - name: Checkout RealityEngine_CPP
        uses: actions/checkout@v7
        with: { repository: jateeter/RealityEngine_CPP, path: RealityEngine_CPP }

      - name: Checkout RealityEngine_LSP
        uses: actions/checkout@v7
        with: { repository: jateeter/RealityEngine_LSP, path: RealityEngine_LSP }

      - name: Checkout RealityEngine_Scala
        uses: actions/checkout@v7
        with: { repository: jateeter/RealityEngine_Scala, path: RealityEngine_Scala }

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.8'

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Install native toolchains (OpenSSL, Boost, SBCL)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libssl-dev libboost-dev sbcl

      - name: Setup sbt
        run: |
          curl -fsSL https://github.com/sbt/sbt/releases/download/v1.12.8/sbt-1.12.8.tgz -o /tmp/sbt.tgz
          sudo tar -xzf /tmp/sbt.tgz -C /opt
          echo "/opt/sbt/bin" >> "$GITHUB_PATH"

      - name: Bootstrap Quicklisp
        working-directory: RealityEngine_LSP
        run: bash scripts/bootstrap-quicklisp.sh --home

      # Each engine loads the FULL corpus and reports how many machines it holds.
      # The counts must agree with each other and with the file count on disk —
      # a runtime that quietly skips a machine shape is invisible any other way.
      - name: Load the full corpus in every runtime and compare counts
        working-directory: RealityEngine_CI
        run: bash scripts/full-corpus-load-parity.sh

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-corpus-load-parity
          path: RealityEngine_CI/.full-corpus/**
          # .full-corpus is a dot-directory, and upload-artifact v4.4+ excludes
          # hidden files by default. The report and every runtime's start log
          # were silently dropped, so the first hosted parity failure
          # (2026-09-25: cpp answered no /api/health within 240s) left
          # nothing to diagnose it with.
          include-hidden-files: true
          retention-days: 30

  # ── Agent corpus: construct all 1,323 specs and verify them ─────────────────
  # The weekly construction of the full OpenClaw agent corpus. It needs no
  # runtime and runs beside the other two jobs. Three questions, each able to
  # fail on its own:
  #   1. Does the generator still produce a corpus that meets
  #      CORPUS_EXIT_CRITERIA §3.7? That means 1,323 specs, the five
  #      arbitration fixtures agent-free, every agent joined, and axis names
  #      agreeing.
  #   2. Is the committed corpus the one the current machine corpus derives? A
  #      difference means the specs in localOpenClawStack are stale. This is the
  #      check that did not exist while they sat five weeks behind.
  #   3. Is the regression profile still in step with its source list?
  agent-corpus:
    name: Full agent corpus — construct and verify (1,323)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout RealityEngine_CI
        uses: actions/checkout@v7
        with:
          path: RealityEngine_CI

      - name: Checkout RealityEngine_Machines
        uses: actions/checkout@v7
        with:
          repository: jateeter/RealityEngine_Machines
          ref: ${{ github.event.inputs.machines_ref || '' }}
          path: RealityEngine_Machines

      - name: Checkout localOpenClawStack
        uses: actions/checkout@v7
        with:
          repository: jateeter/localOpenClawStack
          ref: ${{ github.event.inputs.openclaw_ref || '' }}
          path: localOpenClawStack

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # --fresh clears generated specs but keeps agents/profiles/. The
      # generator is deterministic, so any diff against the checkout is the
      # corpus having moved, not noise.
      - name: Construct the full agent corpus
        working-directory: localOpenClawStack/machine-behaviors
        env:
          MACHINES_DIR: ${{ github.workspace }}/RealityEngine_Machines/machines
        run: |
          set -o pipefail
          python3 materialize_agents.py --fresh 2>&1 | tee "$GITHUB_WORKSPACE/agent-corpus.log"

      - name: Verify against the corpus exit criteria (§3.7)
        working-directory: RealityEngine_CI
        run: |
          python3 scripts/check-corpus-exit-criteria.py \
            --machines ../RealityEngine_Machines --openclaw ../localOpenClawStack

      - name: Regression profile is in step with its source list
        if: always()
        working-directory: localOpenClawStack
        run: python3 scripts/generate-regression-profile.py --check

      - name: Committed agent corpus is current
        if: always()
        working-directory: localOpenClawStack
        run: |
          git add -A -- machine-behaviors/agents
          changed="$(git diff --cached --name-status -- machine-behaviors/agents)"
          if [ -n "$changed" ]; then
            count="$(printf '%s\n' "$changed" | wc -l | tr -d ' ')"
            echo "::error::the committed agent corpus is stale: $count file(s) differ from what the current machine corpus derives. Regenerate with 'python3 machine-behaviors/materialize_agents.py --fresh' and commit."
            printf '%s\n' "$changed" | head -40
            git diff --cached --stat -- machine-behaviors/agents | tail -1
            git diff --cached -- machine-behaviors/agents > "$GITHUB_WORKSPACE/agent-corpus.diff"
            exit 1
          fi
          echo "Committed agent corpus matches the current machine corpus."

      - name: Upload agent corpus log and diff
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-agent-corpus
          path: |
            agent-corpus.log
            agent-corpus.diff
          if-no-files-found: ignore
          retention-days: 30

  # ── One issue per failing sweep, deduplicated ────────────────────────────
  report:
    name: Report drift
    runs-on: ubuntu-latest
    needs: [corpus-static, corpus-load-parity, agent-corpus]
    if: always() && (needs.corpus-static.result == 'failure' || needs.corpus-load-parity.result == 'failure' || needs.agent-corpus.result == 'failure')
    steps:
      - name: Open or update the drift issue
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'Full corpus cycle: sweep found drift';
            const body = [
              `The scheduled full-corpus sweep failed on ${new Date().toISOString().slice(0,10)}.`,
              '',
              `- static sweep: **${{ needs.corpus-static.result }}**`,
              `- load parity:  **${{ needs.corpus-load-parity.result }}**`,
              `- agent corpus: **${{ needs.agent-corpus.result }}** (all 1,323 specs rebuilt and compared)`,
              '',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'The per-PR gates gate the 20-machine regression selection; this sweep is',
              'the only scheduled check over all 1,328. A failure here is a machine shape',
              'or a domain artifact that nothing else looks at.',
            ].join('\n');
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'full-corpus-cycle',
            });
            if (existing.data.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: existing.data[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ['full-corpus-cycle'],
              });
            }
