# Copy the release's third-party images to ghcr.io by digest (owner, 2026-11-12).
# Docker Hub serves layers from a TLS 1.2-only CDN, so a release pulls these
# mirrors instead (release/mirrors.json, release/mirror-images.py). A copy keeps
# the manifest list, so each mirror's digest is its source's; the run fails if
# one is not, and names any mirror an anonymous client cannot pull yet.
name: Mirror third-party images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [release/mirrors.json, release/mirror-images.py, .github/workflows/mirror-images.yml]
  pull_request:
    paths: [release/mirrors.json, release/mirror-images.py, .github/workflows/mirror-images.yml]

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: The catalog covers every third-party image
        run: python3 release/mirror-images.py --check
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy to ghcr.io
        run: python3 release/mirror-images.py --push
