name: Regression Tests

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: 'Regression depth'
        required: true
        type: choice
        default: plan
        options:
          - plan
          - build-only
          - full
      engine_spec:
        description: 'Engine spec passed to startUniverse.sh'
        required: true
        default: 'cpp:1,lsp:1,scala:1'
      openclaw:
        description: 'Require OpenClaw async integration checks'
        required: true
        type: boolean
        default: false
      machine_corpus:
        description: 'Corpus to boot. `regression` is the default and the only deployment corpus with a contended cell, so it is what lets the arbiter stage run.'
        required: false
        type: choice
        default: regression
        options:
          - regression
          - standard-deployment
          - arbiter-fixture
          - standard-deployment-plus-ring
      mqtt_broker_url:
        description: 'MQTT broker URL for the Yuma stream; empty skips MQTT live checks'
        required: false
        default: ''
      mqtt_mappings:
        description: 'Optional Yuma MQTT mappings path on the runner host'
        required: false
        default: ''
      mcp_url:
        description: 'MCP Streamable HTTP service base URL'
        required: true
        default: 'http://127.0.0.1:7331'
      swagger_url:
        description: 'OpenAPI Swagger service base URL'
        required: true
        default: 'http://127.0.0.1:8088'
      compare:
        description: 'Optional previous run id to compare against'
        required: false
        default: ''
      retain:
        description: 'Local run histories to retain on the runner'
        required: true
        default: '20'
      archive_artifacts:
        description: 'Copy certification artifacts to the local regression archive'
        required: true
        type: boolean
        default: true
      create_issue_on_failure:
        description: 'Create or update a GitHub issue when the regression fails'
        required: true
        type: boolean
        default: true
  schedule:
    - cron: '17 9 * * *'

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  # ── Configuration signal ───────────────────────────────────────────────────
  # The scheduled run used to report `skipped` every day, which in a run list
  # is indistinguishable from coverage. It was skipped because
  # REGRESSION_SCHEDULE_ENABLED is unset — the certification suite has never
  # executed once.
  #
  # This job always runs on the schedule and reports the truth: it fails when
  # regression is not runnable, so the daily cron produces a real signal
  # instead of a comfortable one. It costs seconds and starts no services.
  preflight:
    name: Regression Preflight (config check)
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Report regression configuration
        env:
          SCHEDULE_ENABLED: ${{ vars.REGRESSION_SCHEDULE_ENABLED }}
          RUNNER_LABELS: ${{ vars.REGRESSION_RUNNER_LABELS }}
          TIMEOUT_MINUTES: ${{ vars.REGRESSION_TIMEOUT_MINUTES }}
          RUN_MODE: ${{ vars.REGRESSION_SCHEDULE_RUN_MODE }}
        run: |
          echo "REGRESSION_SCHEDULE_ENABLED   = ${SCHEDULE_ENABLED:-<unset>}"
          echo "REGRESSION_RUNNER_LABELS      = ${RUNNER_LABELS:-<unset, defaults to [\"ubuntu-latest\"]>}"
          echo "REGRESSION_TIMEOUT_MINUTES    = ${TIMEOUT_MINUTES:-<unset, defaults to 350>}"
          echo "REGRESSION_SCHEDULE_RUN_MODE  = ${RUN_MODE:-<unset, defaults to full>}"
          echo

          if [ "${SCHEDULE_ENABLED:-}" = "true" ]; then
            echo "::notice::Scheduled regression is enabled; the regression job runs in this workflow."
            exit 0
          fi

          echo "::error::Scheduled regression certification is NOT enabled — it has never run."
          cat <<'MSG'

          The `regression` job is gated on REGRESSION_SCHEDULE_ENABLED == 'true'.
          With it unset, every scheduled run reports "skipped", which reads as
          coverage in the run list while proving nothing.

          The runner and timeout blockers are now fixed in the workflow itself:
          it defaults to ubuntu-latest (proven: the tri-runtime-parity job
          brings cpp + lsp + scala to healthy there in under 6 minutes) with a
          350-minute timeout that fits inside GitHub-hosted's 6h cap.

          So enabling is one variable:

              gh variable set REGRESSION_SCHEDULE_ENABLED --body true

          Consider staging the first scheduled run, since `full` has never
          executed and creates an issue on failure:

              gh variable set REGRESSION_SCHEDULE_RUN_MODE --body build-only

          On a self-hosted runner, override both defaults:

              gh variable set REGRESSION_RUNNER_LABELS   --body '["self-hosted"]'
              gh variable set REGRESSION_TIMEOUT_MINUTES --body 480

          If regression is meant to stay operator-triggered, remove the
          `schedule:` trigger so this workflow stops emitting daily runs.
          MSG
          exit 1

  regression:
    name: Regression workflow
    if: ${{ github.event_name == 'workflow_dispatch' || vars.REGRESSION_SCHEDULE_ENABLED == 'true' }}
    # Blocker 2: this defaulted to ["self-hosted"] with zero runners registered,
    # so enabling the schedule would have queued forever rather than run. A
    # hosted runner is now a proven target — the tri-runtime-parity job brings
    # cpp + lsp + scala to healthy on ubuntu-latest in under 6 minutes, LSP
    # included via the Quicklisp bootstrap. Set REGRESSION_RUNNER_LABELS to
    # override once a self-hosted runner exists.
    runs-on: ${{ fromJSON(vars.REGRESSION_RUNNER_LABELS || '["ubuntu-latest"]') }}
    # Kept: this environment does not exist on the repo yet, so it is currently
    # a no-op label rather than a gate — but it is the natural place to scope
    # regression-only secrets or a required reviewer later.
    environment: regression-live
    # Blocker 3: 480 (8h) exceeded GitHub-hosted's 6h cap, so a hosted run would
    # have been killed by the platform with no useful message. 350 keeps our own
    # timeout inside that ceiling so the job reports its own failure. Raise via
    # REGRESSION_TIMEOUT_MINUTES on a self-hosted runner, where 8h is fine.
    timeout-minutes: ${{ fromJSON(vars.REGRESSION_TIMEOUT_MINUTES || '350') }}

    steps:
      - name: Checkout RealityEngine_CI
        uses: actions/checkout@v4
        with:
          path: RealityEngine_CI
          fetch-depth: 0

      - name: Checkout RealityEngine_CPP
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/RealityEngine_CPP
          path: RealityEngine_CPP
          fetch-depth: 0
          token: ${{ secrets.REPO_ACCESS_TOKEN || github.token }}

      - name: Checkout RealityEngine_LSP
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/RealityEngine_LSP
          path: RealityEngine_LSP
          fetch-depth: 0
          token: ${{ secrets.REPO_ACCESS_TOKEN || github.token }}

      - name: Checkout RealityEngine_Scala
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/RealityEngine_Scala
          path: RealityEngine_Scala
          fetch-depth: 0
          token: ${{ secrets.REPO_ACCESS_TOKEN || github.token }}

      - name: Checkout RealityEngine_Machines
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/RealityEngine_Machines
          path: RealityEngine_Machines
          fetch-depth: 0
          token: ${{ secrets.REPO_ACCESS_TOKEN || github.token }}

      - name: Checkout RealityEngine_Manager
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/RealityEngine_Manager
          path: RealityEngine_Manager
          fetch-depth: 0
          token: ${{ secrets.REPO_ACCESS_TOKEN || github.token }}

      - name: Checkout localAIStack
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/localAIStack
          path: localAIStack
          fetch-depth: 0
          token: ${{ secrets.REPO_ACCESS_TOKEN || github.token }}

      - name: Checkout localOpenClawStack
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/localOpenClawStack
          path: localOpenClawStack
          fetch-depth: 0
          token: ${{ secrets.REPO_ACCESS_TOKEN || github.token }}

      # ── Native toolchains ──────────────────────────────────────────────────
      # This workflow had no provisioning at all: it was written for a
      # self-hosted runner where these were already present. The first hosted
      # run got through all eight worktrees and then died on
      # `RealityEngine_CPP && make all` (exit 2) for want of Boost headers.
      #
      # Gated on runner.environment so a self-hosted runner — which may not
      # permit sudo, and which already has these — is untouched.
      - name: Setup Node.js
        if: runner.environment == 'github-hosted'
        uses: actions/setup-node@v4
        with:
          node-version: '25.5'

      - name: Install native toolchains (OpenSSL, Boost, SBCL)
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libssl-dev libboost-dev sbcl
          g++ --version | head -1
          sbcl --version
          echo "boost/asio.hpp: $(ls /usr/include/boost/asio.hpp 2>/dev/null || echo MISSING)"

      - name: Setup Java for native Scala engines
        if: runner.environment == 'github-hosted'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup sbt for native Scala engines
        if: runner.environment == 'github-hosted'
        run: |
          curl -fsSL https://github.com/sbt/sbt/releases/download/v1.12.8/sbt-1.12.8.tgz -o /tmp/sbt-1.12.8.tgz
          sudo tar -xzf /tmp/sbt-1.12.8.tgz -C /opt
          echo "/opt/sbt/bin" >> "$GITHUB_PATH"

      # The regression run builds from its own worktrees, so bootstrap Quicklisp
      # into $HOME — start.sh falls back there when the worktree has no
      # repo-local quicklisp/, which a fresh worktree never does.
      - name: Cache Quicklisp
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ~/quicklisp
          key: quicklisp-home-${{ runner.os }}-${{ hashFiles('RealityEngine_LSP/reality-engine-lsp.asd') }}
          restore-keys: quicklisp-home-${{ runner.os }}-

      - name: Bootstrap Quicklisp
        if: runner.environment == 'github-hosted'
        working-directory: RealityEngine_LSP
        run: bash scripts/bootstrap-quicklisp.sh --home

      # The compose files pin the Loki logging driver, so `docker compose up`
      # fails with `error looking up logging plugin loki: plugin "loki" not
      # found` before a single container starts. The tri-runtime-parity job
      # installs it; this workflow did not, and the failure landed 27 seconds
      # into universe startup. Self-hosted runners keep it installed.
      - name: Install Loki Docker logging plugin
        if: runner.environment == 'github-hosted'
        working-directory: RealityEngine_CI
        run: |
          docker plugin install grafana/loki-docker-driver:latest --alias loki --grant-all-permissions || \
            docker plugin enable loki

      # The MQTT stage waits for the PE to auto-create sensor sources, which
      # only happens once messages arrive on the mapped topics — a reachable
      # broker is not enough, it has to be carrying traffic. The live Yuma
      # broker carries it, but a certification run should not go red because a
      # third party was down. A local broker seeded from the same mapping
      # registry the engines are configured with is deterministic and offline.
      #
      # Published retained, which is what makes this reliable rather than a
      # race: the mappings set acceptRetained, so an engine subscribing after
      # the publish still receives the last value immediately.
      - name: Start MQTT broker and seed retained readings
        if: runner.environment == 'github-hosted'
        run: |
          set -euo pipefail
          # Config mounted read-only rather than written inside the container:
          # the image runs as an unprivileged user, so an in-container write to
          # /mosquitto/config depends on image-specific ownership. A mount does
          # not, and it leaves the image's own entrypoint and command in place.
          mkdir -p "$RUNNER_TEMP/mosquitto"
          printf 'listener 1883 0.0.0.0\nallow_anonymous true\n' > "$RUNNER_TEMP/mosquitto/mosquitto.conf"
          docker run -d --name regression-mqtt -p 1883:1883 \
            -v "$RUNNER_TEMP/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro" \
            eclipse-mosquitto:2

          for i in $(seq 1 30); do
            if docker exec regression-mqtt mosquitto_pub -h 127.0.0.1 -t healthz -m up 2>/dev/null; then
              echo "broker ready after ${i}s"; break
            fi
            [ "$i" = "30" ] && { echo "::error::MQTT broker did not become ready"; docker logs regression-mqtt; exit 1; }
            sleep 1
          done

          published=0
          while IFS="$(printf '\t')" read -r topic payload; do
            [ -n "$topic" ] || continue
            docker exec regression-mqtt mosquitto_pub -h 127.0.0.1 -r -t "$topic" -m "$payload"
            echo "  retained $topic"
            published=$((published + 1))
          done < <(python3 RealityEngine_CI/scripts/seed-mqtt-fixtures.py \
                     RealityEngine_CPP/config/mqtt-mappings.yuma.json)

          [ "$published" -gt 0 ] || { echo "::error::no MQTT fixtures published"; exit 1; }
          echo "::notice::MQTT broker seeded with $published retained topic(s)"

      # The run-over-run comparison had no baseline on this lane and reported
      # `not-compared` on every scheduled run since it was written, which made
      # the "New failures: 0 / Resolved failures: 0" line in every auto-filed
      # issue structurally meaningless (#230).
      #
      # Only `regression-status.json` is carried, not the whole run directory:
      # it is the only thing `compare_runs` reads, it is a few KB, and keeping
      # the history bounded is otherwise a problem in its own right. The
      # restore-key walks back to the most recent previous run; the exact key
      # includes this run id so each run writes its own entry rather than
      # fighting over one.
      - name: Restore previous regression status (comparison baseline)
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        uses: actions/cache@v4
        with:
          path: RealityEngine_CI/.regression-baseline
          key: regression-baseline-${{ github.run_id }}
          restore-keys: regression-baseline-

      - name: Run regression workflow
        id: regression
        working-directory: RealityEngine_CI
        env:
          # The lane, decided by where we are rather than by a variable someone
          # has to remember to set. `hosted` forbids localAI, OpenClaw and the
          # full corpus; asking for any of them fails the run rather than being
          # quietly corrected.
          PROFILE: ${{ runner.environment == 'github-hosted' && 'hosted' || 'local' }}
          # Matches the tri-runtime-parity job, which is the only job that has
          # actually brought cpp+lsp+scala up on a hosted runner. It sets these
          # two; this workflow set neither, on the same engine spec and the same
          # runner class, and the default health window is sized for one engine.
          NATIVE_HEALTH_ATTEMPTS: '240'
          HOST_IP_OVERRIDE: 127.0.0.1
          # The broker seeded above. Only a fallback — an explicit dispatch
          # input or REGRESSION_MQTT_BROKER_URL still wins, so pointing a run
          # at the live Yuma broker remains one field away.
          HOSTED_MQTT_BROKER_URL: ${{ runner.environment == 'github-hosted' && 'mqtt://127.0.0.1:1883' || '' }}
          # MACHINES_DIR is deliberately NOT set. startUniverse.sh honours it
          # from the environment, and the regression run starts from its own
          # cold-start worktrees — pinning it to the top-level checkout would
          # test the checkout while the manifest recorded worktree SHAs.
          INPUT_RUN_MODE: ${{ github.event.inputs.run_mode }}
          INPUT_ENGINE_SPEC: ${{ github.event.inputs.engine_spec }}
          INPUT_OPENCLAW: ${{ github.event.inputs.openclaw }}
          INPUT_MQTT_BROKER_URL: ${{ github.event.inputs.mqtt_broker_url }}
          INPUT_MQTT_MAPPINGS: ${{ github.event.inputs.mqtt_mappings }}
          INPUT_MCP_URL: ${{ github.event.inputs.mcp_url }}
          INPUT_SWAGGER_URL: ${{ github.event.inputs.swagger_url }}
          INPUT_COMPARE: ${{ github.event.inputs.compare }}
          INPUT_MACHINE_CORPUS: ${{ github.event.inputs.machine_corpus }}
          INPUT_RETAIN: ${{ github.event.inputs.retain }}
          INPUT_ARCHIVE_ARTIFACTS: ${{ github.event.inputs.archive_artifacts }}
          SCHEDULE_RUN_MODE: ${{ vars.REGRESSION_SCHEDULE_RUN_MODE || 'full' }}
          SCHEDULE_ENGINE_SPEC: ${{ vars.REGRESSION_ENGINE_SPEC || 'cpp:1,lsp:1,scala:1' }}
          SCHEDULE_OPENCLAW: ${{ vars.REGRESSION_OPENCLAW || 'false' }}
          SCHEDULE_MQTT_BROKER_URL: ${{ vars.REGRESSION_MQTT_BROKER_URL || '' }}
          SCHEDULE_MQTT_MAPPINGS: ${{ vars.REGRESSION_MQTT_MAPPINGS || '' }}
          SCHEDULE_MCP_URL: ${{ vars.REGRESSION_MCP_URL || 'http://127.0.0.1:7331' }}
          SCHEDULE_SWAGGER_URL: ${{ vars.REGRESSION_SWAGGER_URL || 'http://127.0.0.1:8088' }}
          SCHEDULE_COMPARE: ${{ vars.REGRESSION_COMPARE_RUN || '' }}
          SCHEDULE_RETAIN: ${{ vars.REGRESSION_RETAIN || '20' }}
          SCHEDULE_ARCHIVE_ARTIFACTS: ${{ vars.REGRESSION_ARCHIVE_ARTIFACTS || 'true' }}
        run: |
          set -euo pipefail

          run_id="gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          run_mode="${INPUT_RUN_MODE:-plan}"
          engine_spec="${INPUT_ENGINE_SPEC:-cpp:1,lsp:1,scala:1}"
          openclaw="${INPUT_OPENCLAW:-false}"
          mqtt_broker_url="${INPUT_MQTT_BROKER_URL:-}"
          mqtt_mappings="${INPUT_MQTT_MAPPINGS:-}"
          mcp_url="${INPUT_MCP_URL:-http://127.0.0.1:7331}"
          swagger_url="${INPUT_SWAGGER_URL:-http://127.0.0.1:8088}"
          compare_run="${INPUT_COMPARE:-}"
          machine_corpus="${INPUT_MACHINE_CORPUS:-regression}"
          retain="${INPUT_RETAIN:-20}"
          archive_artifacts="${INPUT_ARCHIVE_ARTIFACTS:-true}"

          if [ "${GITHUB_EVENT_NAME}" = "schedule" ]; then
            run_mode="${SCHEDULE_RUN_MODE:-full}"
            engine_spec="${SCHEDULE_ENGINE_SPEC:-cpp:1,lsp:1,scala:1}"
            openclaw="${SCHEDULE_OPENCLAW:-false}"
            mqtt_broker_url="${SCHEDULE_MQTT_BROKER_URL:-}"
            mqtt_mappings="${SCHEDULE_MQTT_MAPPINGS:-}"
            mcp_url="${SCHEDULE_MCP_URL:-http://127.0.0.1:7331}"
            swagger_url="${SCHEDULE_SWAGGER_URL:-http://127.0.0.1:8088}"
            compare_run="${SCHEDULE_COMPARE:-}"
            # The scheduled run boots `regression`.
            #
            # It stayed on standard-deployment because the alternative was
            # arbiter-fixture — a conformance corpus, not a deployment one,
            # whose nightly use would change what every other stage measures.
            # That reasoning does not reach `regression`: it IS a deployment
            # corpus, standard-deployment's twelve plus the RS ring pair and the
            # contended arbitration trio, so every other stage measures what it
            # measured before and the arbiter stage stops skipping.
            #
            # Without this the stage skips on every scheduled run — which it did,
            # correctly, reporting "corpus has no contended cells" (#274).
            machine_corpus="regression"
            retain="${SCHEDULE_RETAIN:-20}"
            archive_artifacts="${SCHEDULE_ARCHIVE_ARTIFACTS:-true}"
          fi

          # Neither the input nor the schedule variable named a broker, so use
          # the one this job started. Without a broker the stage writes a skip
          # report and passes, which is indistinguishable from coverage.
          if [ -z "$mqtt_broker_url" ]; then
            mqtt_broker_url="${HOSTED_MQTT_BROKER_URL:-}"
          fi

          args=(
            --run-id "$run_id"
            --profile "${PROFILE:-hosted}"
            --engines "$engine_spec"
            --retain "$retain"
            --mcp-url "$mcp_url"
            --swagger-url "$swagger_url"
          )

          case "$run_mode" in
            plan)
              ;;
            build-only)
              args+=(--execute --build-only)
              ;;
            full)
              args+=(--execute)
              ;;
            *)
              echo "Unsupported run mode: $run_mode" >&2
              exit 2
              ;;
          esac

          if [ "$openclaw" = "true" ]; then
            args+=(--openclaw)
          else
            args+=(--no-openclaw)
          fi

          [ -n "$mqtt_broker_url" ] && args+=(--mqtt-broker-url "$mqtt_broker_url")
          [ -n "$mqtt_mappings" ] && args+=(--mqtt-mappings "$mqtt_mappings")
          [ -n "$machine_corpus" ] && args+=(--machine-corpus "$machine_corpus")
          [ -n "$compare_run" ] && args+=(--compare "$compare_run")
          [ "$archive_artifacts" = "true" ] && args+=(--archive "$PWD/.regression-tests/archive")
          # Restored from the previous run by the cache step above. Absent on
          # the very first run after this landed, which reports not-compared
          # once and then has a baseline from then on (#230).
          [ -f "$PWD/.regression-baseline/regression-status.json" ] && \
            args+=(--baseline-status "$PWD/.regression-baseline/regression-status.json")

          echo "::notice::Regression lane '${PROFILE:-hosted}' — run mode $run_mode, engines $engine_spec"

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_dir=.regression-tests/runs/$run_id" >> "$GITHUB_OUTPUT"

          bash scripts/regression-test.sh "${args[@]}"

      # Written whatever the run's verdict: a passing run is exactly the
      # baseline that makes the next run's failures show up as *new*.
      - name: Save this run's status as the next baseline
        if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        working-directory: RealityEngine_CI
        run: |
          src=".regression-tests/runs/${{ steps.regression.outputs.run_id }}/reports/regression-status.json"
          if [ -f "$src" ]; then
            mkdir -p .regression-baseline
            cp "$src" .regression-baseline/regression-status.json
            echo "::notice::baseline saved from ${{ steps.regression.outputs.run_id }}"
          else
            # Leave the previous baseline in place rather than clearing it: a run
            # that died before the report stage should not cost the next run its
            # comparison.
            echo "::warning::no regression-status.json; keeping the previous baseline"
          fi

      - name: Upload regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ steps.regression.outputs.run_id || github.run_id }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            RealityEngine_CI/.regression-tests/runs/*/summary.md
            RealityEngine_CI/.regression-tests/runs/*/manifest.json
            RealityEngine_CI/.regression-tests/runs/*/reports/service-inventory.json
            RealityEngine_CI/.regression-tests/runs/*/reports/regression-comparison.json
            RealityEngine_CI/.regression-tests/runs/*/reports/regression-status.json
            # The whole directory, not just the two summary files: the stage
            # also writes one <event>-<instance>.json per runtime holding the
            # actual response. When a runtime answered HTTP 400 those bodies
            # were the diagnosis and none of them were uploaded, so the cause
            # had to be recovered by reading the runtime's source instead.
            RealityEngine_CI/.regression-tests/runs/*/responses/universal-vectors/*.json
            RealityEngine_CI/.regression-tests/runs/*/reports/mqtt-yuma*.json
            RealityEngine_CI/.regression-tests/runs/*/reports/mcp-smoke.json
            RealityEngine_CI/.regression-tests/runs/*/reports/openclaw*.json
            # Command logs. Without these a failed stage is an exit code and
            # nothing else — the run directory dies with the runner. The
            # hosted lane configures no secrets and startUniverse.sh does not
            # echo credentials or dump the environment.
            RealityEngine_CI/.regression-tests/runs/*/logs/*.log

      # No teardown existed. On an ephemeral hosted runner that is harmless —
      # the VM is destroyed — but the local lane runs on hardware that persists
      # between runs, where a left-running universe holds the ports the next
      # run pre-checks and turns one bad run into every subsequent one failing.
      # continue-on-error because failing to clean up is a hygiene problem, not
      # a certification result: it must be visible without turning a green run
      # red or a red run green.
      - name: Stop universe
        if: always()
        continue-on-error: true
        working-directory: RealityEngine_CI
        run: ./stopUniverse.sh

      - name: Stop MQTT broker
        if: always()
        continue-on-error: true
        run: |
          docker logs regression-mqtt 2>&1 | tail -30 || true
          docker rm -f regression-mqtt || true

      - name: Create or update regression failure issue
        if: ${{ failure() && (github.event_name == 'schedule' || github.event.inputs.create_issue_on_failure == 'true') }}
        uses: actions/github-script@v7
        env:
          REGRESSION_RUN_ID: ${{ steps.regression.outputs.run_id }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const {
              parseFailingStages,
              failureSignature,
              issueTitle,
              renderIssueBody
            } = await import(
              path.join(process.cwd(), 'RealityEngine_CI', 'scripts', 'lib', 'regression-issue-filer.mjs')
            );

            const runId = process.env.REGRESSION_RUN_ID || `gha-${context.runId}-${context.runAttempt}`;
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const summaryPath = path.join(process.cwd(), 'RealityEngine_CI', '.regression-tests', 'runs', runId, 'summary.md');
            let summary = 'summary.md was not generated before the workflow failed.';
            if (fs.existsSync(summaryPath)) {
              summary = fs.readFileSync(summaryPath, 'utf8').split('\n').slice(0, 160).join('\n');
            }

            // Key the issue on the set of failing stages, not the run id: the
            // run id is unique per run, so keying on it meant `existing` below
            // could never match and every failing nightly opened a new issue
            // (#229). A recurring failure (same failing stages) now updates
            // one issue; a failure with a different stage set opens a new one.
            const signature = failureSignature(parseFailingStages(summary));
            const title = issueTitle(signature);

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find((issue) => issue.title === title);
            // This run's record, on its own. Referenced by both branches below
            // and never defined, so this step threw `ReferenceError: entry is
            // not defined` on every regression failure — the step whose whole
            // job is recording a failure was the one that could not run when
            // there was one to record.
            const entry = [
              `Actions run: ${runUrl}`,
              `Run id: \`${runId}\``,
              `Timestamp: ${new Date().toISOString()}`,
              '',
              '```markdown',
              summary,
              '```',
            ].join('\n');
            const body = renderIssueBody({
              signature,
              runId,
              runUrl,
              timestamp: new Date().toISOString(),
              summary,
              previousBody: existing ? existing.body : undefined
            });
            if (existing) {
              // A comment, not a body replacement. `issues.update` overwrote the
              // body wholesale, so even if the match had worked the recurrence
              // history would have been discarded on every hit — and knowing a
              // failure is on its fifth night is most of its triage value.
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `Still failing.\n\n${entry}`
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                // `body` is renderIssueBody's output — the occurrence block a
                // later recurrence parses to carry history forward. Building a
                // one-off body here instead left that block absent, so the
                // first recurrence would have had nothing to accumulate onto.
                body
              });
            }
