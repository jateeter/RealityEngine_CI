# Prometheus's own listener on the lane (RealityEngine_CI#730, #729): TLS 1.3 on
# its container's loopback (127.0.0.1:9091), behind its OpenSSL front, which
# serves :9090 at the profile and requires the lane client certificate
# (Grafana, its own self-scrape and the harness present theirs). Only the
# front, in the same network namespace, reaches this listener. curve_preferences is left unset on purpose: in Go
# an explicit list replaces the default and drops X25519MLKEM768, which
# Prometheus 3.15 cannot name, so setting one would lose post-quantum key
# exchange to remove P-256. The upgrade to v3 was made for that key exchange
# (owner, 2026-11-08), so P-256 stays negotiable under the Go deficiency.
tls_server_config:
  cert_file:        /run/re-tls/service/chain.pem
  key_file:         /run/re-tls/service/key.pem
  client_auth_type: NoClientCert
  min_version:      TLS13
