# Prometheus scrape config for the Reality Engine CES coverage telemetry.
#
# All three runtimes (Scala, C++, Common Lisp) expose /api/metrics in
# identical Prometheus text format.  Every metric line carries a
# `runtime="scala"|"cpp"|"lsp"` label so a single Grafana dashboard can
# pivot by source runtime without scrape-time relabels.
#
# Targets are split between:
#   • compose-internal — Docker services reachable on the reality-network
#     bridge.  These use the project self-signed CA and the service hostname
#     for SAN validation.  The Scala RE runs on port 5001 inside the proxy.
#   • registry-discovered — native multi-engine instances emitted by
#     startUniverse.sh into /etc/prometheus/file_sd/*.json.  Reached via
#     host.docker.internal so Prometheus can scrape host-native runtimes.

global:
  scrape_interval:     5s
  evaluation_interval: 5s
  external_labels:
    cluster:     reality-engine
    environment: dev

scrape_configs:
  # ── Compose-internal (HTTPS via bridge network, TLS to self-signed CA) ──

  # Scala Reality Engine — inside the compose network (internal port 3000,
  # exposed on host via nginx at https://localhost:5001).
  - job_name:     reality-engine-scala-compose
    metrics_path: /api/metrics
    scheme:       https
    # runtime= label is emitted by the engine; preserve it so dashboards'
    # {runtime=~"$runtime"} queries work without exported_runtime aliasing.
    honor_labels: true
    tls_config:
      ca_file:     /etc/prometheus/certs/ca.crt
      server_name: reality-engine
    static_configs:
      - targets:
          - reality-engine:3000
        labels:
          runtime:   scala
          component: reality-engine
          source:    compose

  # Scala Perception Engine — TypeScript backend inside compose.
  - job_name:     perception-engine-scala-compose
    metrics_path: /api/metrics
    scheme:       https
    honor_labels: true
    tls_config:
      ca_file:     /etc/prometheus/certs/ca.crt
      server_name: perception-engine-backend
    static_configs:
      - targets:
          - perception-engine-backend:3004
        labels:
          runtime:   scala
          component: perception-engine
          source:    compose

  # ── Registry-discovered host-native instances ────────────────────────────
  # startUniverse.sh writes these files from the live RE registry so dashboards
  # follow the actual scala/cpp/lsp ports instead of fixed defaults.

  - job_name:     reality-engine-registry
    metrics_path: /api/metrics
    honor_labels: true
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/reality-engine-targets.json
        refresh_interval: 10s

  - job_name:     perception-engine-registry
    metrics_path: /api/metrics
    honor_labels: true
    file_sd_configs:
      - files:
          - /etc/prometheus/file_sd/perception-engine-targets.json
        refresh_interval: 10s

  # ── AI bridge operations — CI-owned exporter for OpenClaw/localAIStack ───
  - job_name:     ai-bridge-operations
    metrics_path: /metrics
    honor_labels: true
    static_configs:
      - targets:
          - host.docker.internal:7342
        labels:
          component: ai-bridge-metrics
          source:    host

  # ── Qdrant — vector DB metrics ───────────────────────────────────────────
  # Qdrant exposes Prometheus metrics at /metrics on its REST port; localAIStack
  # maps that to host port 4333.  Port 4334 is gRPC and is not HTTP-scrapable.
  - job_name:     qdrant
    metrics_path: /metrics
    honor_labels: true
    static_configs:
      - targets:
          - host.docker.internal:4333
        labels:
          component: qdrant
          source:    host

  # ── Prometheus itself — confirms the scrape stack is healthy ──────────────
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
