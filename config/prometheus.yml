# Prometheus scrape config for the Reality Engine CES coverage telemetry.
#
# All three runtimes (Scala, C++, Common Lisp) expose /api/metrics in
# identical Prometheus text format.  Every metric line carries a
# `runtime="scala"|"cpp"|"lsp"` label so a single Grafana dashboard can
# pivot by source runtime without scrape-time relabels.
#
# The Perception Engine (PE) on each runtime exposes /api/metrics with
# PE-specific counters (source activations, perceive calls, MQTT messages).
#
# Targets are split between:
#   • compose-internal — Docker services reachable on the reality-network
#     bridge.  These use the project self-signed CA and the service hostname
#     for SAN validation.  The Scala RE runs on port 5001 inside the proxy.
#   • host-dev — native `bin/reality_engine_server` / start.sh instances.
#     Reached via host.docker.internal.  Scrapes fail silently when those
#     processes are not running (honor_labels: true).

global:
  scrape_interval:     5s
  evaluation_interval: 5s
  external_labels:
    cluster:     reality-engine
    environment: dev

scrape_configs:
  # ── Compose-internal (HTTPS via bridge network, TLS to self-signed CA) ──

  # Scala Reality Engine — inside the compose network (internal port 3000,
  # exposed on host via nginx at https://localhost:5001).
  - job_name:     reality-engine-scala-compose
    metrics_path: /api/metrics
    scheme:       https
    # runtime= label is emitted by the engine; preserve it so dashboards'
    # {runtime=~"$runtime"} queries work without exported_runtime aliasing.
    honor_labels: true
    tls_config:
      ca_file:     /etc/prometheus/certs/ca.crt
      server_name: reality-engine
    static_configs:
      - targets:
          - reality-engine:3000
        labels:
          runtime:   scala
          component: reality-engine
          source:    compose

  # Scala Perception Engine — TypeScript backend inside compose.
  - job_name:     perception-engine-scala-compose
    metrics_path: /api/metrics
    scheme:       https
    honor_labels: true
    tls_config:
      ca_file:     /etc/prometheus/certs/ca.crt
      server_name: perception-engine-backend
    static_configs:
      - targets:
          - perception-engine-backend:3004
        labels:
          runtime:   scala
          component: perception-engine
          source:    compose

  # ── Host-dev native instances ─────────────────────────────────────────────
  # Scrapes fail silently when a given runtime is not running.

  # Reality Engine — host-native instances
  - job_name:     reality-engine-scala-host
    metrics_path: /api/metrics
    honor_labels: true
    static_configs:
      - targets:
          - host.docker.internal:5001
        labels:
          runtime:   scala
          component: reality-engine
          source:    host

  - job_name:     reality-engine-cpp-host
    metrics_path: /api/metrics
    honor_labels: true
    static_configs:
      - targets:
          - host.docker.internal:5301
        labels:
          runtime:   cpp
          component: reality-engine
          source:    host

  - job_name:     reality-engine-lsp-host
    metrics_path: /api/metrics
    honor_labels: true
    static_configs:
      - targets:
          - host.docker.internal:5601
        labels:
          runtime:   lsp
          component: reality-engine
          source:    host

  # Perception Engine — host-native instances (one per runtime)
  - job_name:     perception-engine-scala-host
    metrics_path: /api/metrics
    honor_labels: true
    static_configs:
      - targets:
          - host.docker.internal:5000
        labels:
          runtime:   scala
          component: perception-engine
          source:    host

  - job_name:     perception-engine-cpp-host
    metrics_path: /api/metrics
    honor_labels: true
    static_configs:
      - targets:
          - host.docker.internal:5300
        labels:
          runtime:   cpp
          component: perception-engine
          source:    host

  - job_name:     perception-engine-lsp-host
    metrics_path: /api/metrics
    honor_labels: true
    static_configs:
      - targets:
          - host.docker.internal:5600
        labels:
          runtime:   lsp
          component: perception-engine
          source:    host

  # ── localAIStack FastAPI — RAG orchestration metrics ─────────────────────
  # FastAPI exposes /metrics via prometheus-fastapi-instrumentator.
  # Host-dev path: localai_api runs on the host (not in compose network)
  # so we reach it via host.docker.internal.
  - job_name:     localaistack-api
    metrics_path: /metrics
    honor_labels: true
    static_configs:
      - targets:
          - host.docker.internal:4000
        labels:
          component: localaistack-api
          source:    host

  # ── Qdrant — vector DB metrics ───────────────────────────────────────────
  # Qdrant exposes Prometheus metrics at /metrics (REST port 6334 by default;
  # localAIStack maps it to host port 4333 with metrics on 4334 if enabled).
  - job_name:     qdrant
    metrics_path: /metrics
    honor_labels: true
    static_configs:
      - targets:
          - host.docker.internal:4334
        labels:
          component: qdrant
          source:    host

  # ── Prometheus itself — confirms the scrape stack is healthy ──────────────
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
