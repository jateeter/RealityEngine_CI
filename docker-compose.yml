version: '3.8'

# Shared by the six engine-* services (the C++/LSP/Scala RE+PE trio). They are
# the containerized counterpart of `startUniverse.sh --engines=cpp:1,lsp:1,scala:1`:
# plain HTTP, each RE paired with its own runtime's PE, published on host
# ports that mirror the native band layout one thousand up (scala 6100/6101,
# cpp 6300/6301, lsp 6600/6601: PE then RE), so they collide with neither the
# native universe nor the TLS proxy. startUniverse.sh registers them in the
# instance registry as scala-1, cpp-1 and lsp-1 — the three-engine suites in
# run-all-tests.sh need exactly that and skipped without it (#363).
x-engine-logging: &engine-logging
  driver: loki
  options:
    loki-url: "https://localhost:3100/loki/api/v1/push"
    loki-tls-insecure-skip-verify: "true"
    loki-batch-size: "400"
    loki-retries: "2"
    loki-max-backoff: "1000ms"
    loki-external-labels: "service=engine,environment=production,app=reality-engine"

x-engine-common: &engine-common
  restart: unless-stopped
  networks:
    - reality-network
  extra_hosts:
    - "host.docker.internal:host-gateway"
  logging: *engine-logging
  depends_on:
    loki:
      condition: service_healthy

# Corpus + semantics mounts, the same pair reality-engine takes (see there for
# why both, and why MACHINE_CORPUS_DIR rather than MACHINES_DIR).
x-engine-corpus: &engine-corpus
  - ${MACHINE_CORPUS_DIR:-${MACHINES_DIR:?MACHINES_DIR must be set — run via startUniverse.sh}}/machines:/app/machines:ro
  - ${MACHINE_CORPUS_DIR:-${MACHINES_DIR:?MACHINES_DIR must be set — run via startUniverse.sh}}/semantics:/app/semantics:ro

# Instance identity (RealityEngine_CI#296). A UUID belongs to an instance, never
# to an engine type or image, and no two instances may share one. startUniverse.sh
# allocates one per instance and writes it to <state>/docker/<id>.env, loaded
# below, so any tool that recreates a container presents the same UUID; absent
# the file, the engine mints its own. Each RE keeps its Lamport clock on the
# <state>/clock-docker bind mount, so the clock survives the container.
x-engine-re-volumes: &engine-re-volumes
  - ${MACHINE_CORPUS_DIR:-${MACHINES_DIR:?MACHINES_DIR must be set — run via startUniverse.sh}}/machines:/app/machines:ro
  - ${MACHINE_CORPUS_DIR:-${MACHINES_DIR:?MACHINES_DIR must be set — run via startUniverse.sh}}/semantics:/app/semantics:ro
  - ${RE_INSTANCE_STATE_DIR:-${HOME}/.reality-engine}/clock-docker:/var/lib/reality-engine/clock

x-engine-re-env: &engine-re-env
  MACHINES_DIR: /app/machines
  VECTOR_DIMENSION: ${VECTOR_DIMENSION:-7680}
  QDRANT_URL: http://host.docker.internal:4333
  SEMANTICS_MANIFEST: /app/semantics/abox-manifest.json

x-engine-pe-volumes: &engine-pe-volumes
  - ${MACHINE_CORPUS_DIR:-${MACHINES_DIR:?MACHINES_DIR must be set — run via startUniverse.sh}}/machines:/app/machines:ro
  - ${MACHINE_CORPUS_DIR:-${MACHINES_DIR:?MACHINES_DIR must be set — run via startUniverse.sh}}/semantics:/app/semantics:ro
  - ./config:/app/config:ro
  - ../localAIStack/data/machines:/app/localai-machines:ro

services:
  # Loki - Log Aggregation (TLS enabled)
  # Port 3100 kept bound to host: the Docker logging driver runs on the host
  # daemon and needs localhost:3100 to push logs into the container network.
  loki:
    image: grafana/loki:2.9.3
    container_name: reality-engine-loki
    ports:
      - "3100:3100"
    volumes:
      - ./config/loki-config.yml:/etc/loki/local-config.yaml
      - ./certs:/etc/loki/certs:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    networks:
      - reality-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Prometheus — scrapes /api/metrics from each runtime for CES coverage gauges.
  # Reaches native RE (5001/5301/5601) and PE (5000/5300/5600) instances on
  # the host via host.docker.internal, plus Docker-compose services internally.
  # All runtimes emit identical metric names; a runtime= label distinguishes them.
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: reality-engine-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.listen-address=:9090
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${PROMETHEUS_FILE_SD_DIR:-./config/prometheus-file-sd}:/etc/prometheus/file_sd:ro
      - ./certs:/etc/prometheus/certs:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    networks:
      - reality-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Grafana - accessed via TLS proxy at https://localhost:3000
  grafana:
    image: grafana/grafana:10.2.3
    container_name: reality-engine-grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_INSTALL_PLUGINS=grafana-clock-panel
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3002}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./config/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - ./config/dashboards:/var/lib/grafana/dashboards
    ports:
      - "127.0.0.1:3002:3000"
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - reality-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Reality Engine API (Scala/Akka HTTP) - accessed via TLS proxy at https://localhost:5001
  # Source: ../RealityEngine_Scala  (context set below; Dockerfile in CI docker/scala/)
  # Machines: volume-mounted from ${MACHINES_DIR}/machines (RealityEngine_Machines repo)
  reality-engine:
    build:
      context: ../RealityEngine_Scala
      dockerfile: ../RealityEngine_CI/docker/scala/Dockerfile
    container_name: reality-engine-app
    environment:
      # Unified Qdrant: localAIStack exposes Qdrant on host port 4333.
      # host.docker.internal resolves to the host from within this Docker network.
      - QDRANT_URL=http://host.docker.internal:4333
      - COLLECTION_NAME=reality-events
      - VECTOR_DIMENSION=${VECTOR_DIMENSION:-7680}
      - PORT=3000
      - MACHINES_DIR=/app/machines
      - KEYSTORE_PATH=/etc/certs/keystore.p12
      - KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD:-realityengine}
      - CA_CERT_PATH=/etc/certs/ca.crt
      - AUDIT_LOG_ENABLED=true
      - AUDIT_LOG_LEVEL=2
      - AUDIT_LOG_SERVICE=reality-engine
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - reality-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # MACHINE_CORPUS_DIR, not MACHINES_DIR. The two are different questions —
      # "where is the Machines repo" (node_modules, presence checks) and "which
      # corpus did this deployment select" — and one name answering both is how
      # --machine-corpus came to be honoured by the materializer and discarded
      # here (#328). Falls back to the repo when no corpus was materialized.
      - ${MACHINE_CORPUS_DIR:-${MACHINES_DIR:?MACHINES_DIR must be set — run via startUniverse.sh}}/machines:/app/machines:ro
      # The semantics manifest, beside the corpus rather than inside it.
      #
      # SEMANTIC_AUDIT_CONTRACT.md is built on joining runtime behaviour to the
      # corpus by IRI "with no name matching". The engine resolves those IRIs by
      # walking up from MACHINES_DIR looking for semantics/abox-manifest.json —
      # and only machines/ was mounted, so inside the container there was nothing
      # to find. Every re:SequenceObservation came out with machineIri,
      # sequenceIri and stepIri null, which the contract also permits for a
      # machine genuinely absent from the manifest, so the records looked
      # well-formed while carrying none of the join the milestone exists for.
      - ${MACHINE_CORPUS_DIR:-${MACHINES_DIR:?MACHINES_DIR must be set — run via startUniverse.sh}}/semantics:/app/semantics:ro
      - ./certs:/etc/certs:ro
    logging:
      driver: loki
      options:
        loki-url: "https://localhost:3100/loki/api/v1/push"
        loki-tls-insecure-skip-verify: "true"
        loki-batch-size: "400"
        loki-retries: "2"
        loki-max-backoff: "1000ms"
        loki-external-labels: "service=reality-engine,environment=production,app=reality-engine"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Engine trio: Scala, C++, LSP — each RE with its own runtime's PE ──────
  # Registered by startUniverse.sh as scala-1 / cpp-1 / lsp-1. The Scala RE
  # reuses reality-engine's image but runs without a keystore, so it serves
  # plain HTTP like its native counterpart and like the other two runtimes.
  engine-scala-re:
    <<: *engine-common
    build:
      context: ../RealityEngine_Scala
      dockerfile: ../RealityEngine_CI/docker/scala/Dockerfile
    container_name: re-engine-scala-re
    environment:
      <<: *engine-re-env
      PORT: "3000"
      JAVA_TOOL_OPTIONS: ${ENGINE_SCALA_RE_JAVA_OPTS:--Xmx3g}
    env_file:
      - path: ${RE_INSTANCE_STATE_DIR:-${HOME}/.reality-engine}/docker/scala-1.env
        required: false
    volumes: *engine-re-volumes
    ports:
      - "6101:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  engine-scala-pe:
    <<: *engine-common
    build:
      context: ../RealityEngine_Scala/perception-engine
      dockerfile: ../../RealityEngine_CI/docker/scala-perception-engine/Dockerfile
    container_name: re-engine-scala-pe
    environment:
      - PORT=3004
      - PERCEPTION_ENGINE_PORT=3004
      - REALITY_ENGINE_URL=http://engine-scala-re:3000
      - DATA_PATH=/app/data
      - FRESH_START=true
      - JAVA_TOOL_OPTIONS=${ENGINE_SCALA_PE_JAVA_OPTS:--Xmx2g}
      - MACHINES_DIR=/app/machines
      - VECTOR_DIMENSION=${VECTOR_DIMENSION:-7680}
      - QDRANT_URL=http://host.docker.internal:4333
      - SEMANTICS_MANIFEST=/app/semantics/abox-manifest.json
      - LOCAL_AI_API_URL=http://host.docker.internal:4000
      - LOCAL_AI_MACHINES_DIR=/app/localai-machines
      - INTEGRATIONS_CONFIG=/app/config/integrations.json
      # Pass-through from the host shell, as for perception-engine-backend.
      # Bare names on purpose: deploy-validate's restart reads these names
      # back from the running container (compose_passthrough_names), and a
      # value interpolated here would come back empty on a recreate.
      - ACP_ENABLED
      - ACP_PLATFORM
      - ACP_SURFACE
      - ACP_GATEWAY_URL
      - OPENCLAW_GATEWAY_URL
      - ACP_SESSION_KEY
      - OPENCLAW_ACP_SESSION
      - ACP_TARGET_AGENT
      - ACP_COMPLETION_SOURCE_MAPPING_ID
      - HEALTHKIT_BRIDGE_TOKEN
      - TRIGGERS_ENABLED
      - TRIGGER_DISPATCH_MODE
      - TRIGGER_GRAPHQL_URL
    volumes: *engine-pe-volumes
    ports:
      - "6100:3004"
    depends_on:
      engine-scala-re:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3004/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  engine-cpp-re:
    <<: *engine-common
    build:
      context: ../RealityEngine_CPP
      dockerfile: ../RealityEngine_CI/docker/cpp/Dockerfile
    container_name: re-engine-cpp-re
    environment: *engine-re-env
    # Positional arguments, as RealityEngine_CPP/start.sh passes them.
    command: ["/app/bin/reality_engine_server", "3000", "/app/machines", "${VECTOR_DIMENSION:-7680}"]
    env_file:
      - path: ${RE_INSTANCE_STATE_DIR:-${HOME}/.reality-engine}/docker/cpp-1.env
        required: false
    volumes: *engine-re-volumes
    ports:
      - "6301:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  engine-cpp-pe:
    <<: *engine-common
    # Same build as engine-cpp-re (one image, two roles); the layer cache
    # makes the second build free, and every service keeps the
    # realityengine_ci-<service> image name startUniverse.sh verifies.
    build:
      context: ../RealityEngine_CPP
      dockerfile: ../RealityEngine_CI/docker/cpp/Dockerfile
    container_name: re-engine-cpp-pe
    environment:
      - MACHINES_DIR=/app/machines
      - VECTOR_DIMENSION=${VECTOR_DIMENSION:-7680}
      - QDRANT_URL=http://host.docker.internal:4333
      - SEMANTICS_MANIFEST=/app/semantics/abox-manifest.json
      - LOCAL_AI_API_URL=http://host.docker.internal:4000
      - LOCAL_AI_MACHINES_DIR=/app/localai-machines
      - INTEGRATIONS_CONFIG=/app/config/integrations.json
      # Pass-through from the host shell, as for perception-engine-backend.
      # Bare names on purpose: deploy-validate's restart reads these names
      # back from the running container (compose_passthrough_names), and a
      # value interpolated here would come back empty on a recreate.
      - ACP_ENABLED
      - ACP_PLATFORM
      - ACP_SURFACE
      - ACP_GATEWAY_URL
      - OPENCLAW_GATEWAY_URL
      - ACP_SESSION_KEY
      - OPENCLAW_ACP_SESSION
      - ACP_TARGET_AGENT
      - ACP_COMPLETION_SOURCE_MAPPING_ID
      - HEALTHKIT_BRIDGE_TOKEN
      - TRIGGERS_ENABLED
      - TRIGGER_DISPATCH_MODE
      - TRIGGER_GRAPHQL_URL
    command: ["/app/bin/perception_engine_server", "3004", "http://engine-cpp-re:3000",
              "http://host.docker.internal:4000", "/app/localai-machines", "${VECTOR_DIMENSION:-7680}"]
    volumes: *engine-pe-volumes
    ports:
      - "6300:3004"
    depends_on:
      engine-cpp-re:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3004/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  engine-lsp-re:
    <<: *engine-common
    build:
      context: ../RealityEngine_LSP
      dockerfile: ../RealityEngine_CI/docker/lsp/Dockerfile
    container_name: re-engine-lsp-re
    environment:
      <<: *engine-re-env
      REALITY_ENGINE_PORT: "3000"
    command: ["reality"]
    env_file:
      - path: ${RE_INSTANCE_STATE_DIR:-${HOME}/.reality-engine}/docker/lsp-1.env
        required: false
    volumes: *engine-re-volumes
    ports:
      - "6601:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  engine-lsp-pe:
    <<: *engine-common
    # Same build as engine-lsp-re (one image, two roles); the layer cache
    # makes the second build free, and every service keeps the
    # realityengine_ci-<service> image name startUniverse.sh verifies.
    build:
      context: ../RealityEngine_LSP
      dockerfile: ../RealityEngine_CI/docker/lsp/Dockerfile
    container_name: re-engine-lsp-pe
    environment:
      - PERCEPTION_ENGINE_PORT=3004
      - REALITY_ENGINE_URL=http://engine-lsp-re:3000
      - MACHINES_DIR=/app/machines
      - VECTOR_DIMENSION=${VECTOR_DIMENSION:-7680}
      - QDRANT_URL=http://host.docker.internal:4333
      - SEMANTICS_MANIFEST=/app/semantics/abox-manifest.json
      - LOCAL_AI_API_URL=http://host.docker.internal:4000
      - LOCAL_AI_MACHINES_DIR=/app/localai-machines
      - INTEGRATIONS_CONFIG=/app/config/integrations.json
      # Pass-through from the host shell, as for perception-engine-backend.
      # Bare names on purpose: deploy-validate's restart reads these names
      # back from the running container (compose_passthrough_names), and a
      # value interpolated here would come back empty on a recreate.
      - ACP_ENABLED
      - ACP_PLATFORM
      - ACP_SURFACE
      - ACP_GATEWAY_URL
      - OPENCLAW_GATEWAY_URL
      - ACP_SESSION_KEY
      - OPENCLAW_ACP_SESSION
      - ACP_TARGET_AGENT
      - ACP_COMPLETION_SOURCE_MAPPING_ID
      - HEALTHKIT_BRIDGE_TOKEN
      - TRIGGERS_ENABLED
      - TRIGGER_DISPATCH_MODE
      - TRIGGER_GRAPHQL_URL
    command: ["perception"]
    volumes: *engine-pe-volumes
    ports:
      - "6600:3004"
    depends_on:
      engine-lsp-re:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3004/api/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  # Visualizer Backend (Node.js/Express) - accessed via TLS proxy at https://localhost:3001
  # Source: ../RealityEngine_Manager/visualizer/backend
  visualizer-backend:
    build:
      context: ../RealityEngine_Manager/visualizer/backend
      dockerfile: Dockerfile
    container_name: reality-engine-visualizer-backend
    environment:
      - VIZ_PORT=3001
      # The Load Machines modal's catalog (GET /api/corpus/tree). Unset, the
      # backend fell back to a sibling-repo path that does not exist in the
      # image, answered 200 with an empty tree, and the modal rendered no rows
      # in the Docker lane only (RealityEngine_Machines#126). The full corpus,
      # as natively: the catalog is what can be loaded, marked against what is.
      - MACHINES_DIR=/app/corpus
      - REALITY_ENGINE_URL=https://reality-engine:3000
      - PERCEPTION_ENGINE_URL=https://perception-engine-backend:3004
      # The instance registry startUniverse.sh serves on the host (0.0.0.0).
      # Without it Manager knew only the pair above and could not switch to the
      # engine-* instances the registry lists (#363). Manager polls it, so it
      # need not exist yet when this container starts.
      - RE_REGISTRY_URL=http://host.docker.internal:${REGISTRY_PORT:-5999}/re-registry.json
      - TLS_CERT_PATH=/etc/certs/server.crt
      - TLS_KEY_PATH=/etc/certs/server.key
      - NODE_EXTRA_CA_CERTS=/etc/certs/ca.crt
      # The instance registry publishes the frontend at $HOST_IP (startUniverse.sh
      # exports it before `compose up`), and tests that open the page there send
      # that origin. localhost alone rejected every switch with a CORS 500 (#363).
      - ALLOWED_ORIGINS=https://localhost:5173,https://localhost:3001,https://${HOST_IP:-localhost}:5173,https://${HOST_IP:-localhost}:3001
      - AUDIT_LOG_ENABLED=true
      - AUDIT_LOG_LEVEL=2
      - AUDIT_LOG_SERVICE=visualizer-backend
      - VIZ_CACHE_TTL_MS=${VIZ_CACHE_TTL_MS:-500}
      # Rate limits, matching startUniverse.sh's defaults so the two lanes agree
      # (RealityEngine_Manager#152). Without these the Docker lane ran at the
      # server.ts defaults of 200/120 while the native lane ran 25x higher, and
      # every Playwright worker presents as 127.0.0.1 so the whole suite shares
      # one bucket. That asymmetry is what produced the 11 saved e2e artifacts
      # carrying "Failed to load machine graph (HTTP 429)" in #122 — all of them
      # from this lane, none from the native one.
      - VIZ_RATE_LIMIT_MAX=${VIZ_RATE_LIMIT_MAX:-5000}
      - VIZ_MACHINES_RATE_LIMIT_MAX=${VIZ_MACHINES_RATE_LIMIT_MAX:-2000}
    depends_on:
      reality-engine:
        condition: service_healthy
      loki:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - reality-network
    volumes:
      - ./certs:/etc/certs:ro
      - ${MACHINES_DIR:?MACHINES_DIR must be set — run via startUniverse.sh}/machines:/app/corpus/machines:ro
    logging:
      driver: loki
      options:
        loki-url: "https://localhost:3100/loki/api/v1/push"
        loki-tls-insecure-skip-verify: "true"
        loki-batch-size: "400"
        loki-retries: "2"
        loki-max-backoff: "1000ms"
        loki-external-labels: "service=visualizer-backend,environment=production,app=reality-engine"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "--no-check-certificate", "https://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Visualizer Frontend (React App) - accessed via TLS proxy at https://localhost:5173
  # Source: ../RealityEngine_Manager/visualizer/frontend
  visualizer-frontend:
    build:
      context: ../RealityEngine_Manager/visualizer/frontend
      dockerfile: Dockerfile
    container_name: reality-engine-visualizer-frontend
    depends_on:
      - visualizer-backend
      - loki
    restart: unless-stopped
    networks:
      - reality-network
    logging:
      driver: loki
      options:
        loki-url: "https://localhost:3100/loki/api/v1/push"
        loki-tls-insecure-skip-verify: "true"
        loki-batch-size: "400"
        loki-retries: "2"
        loki-max-backoff: "1000ms"
        loki-external-labels: "service=visualizer-frontend,environment=production,app=reality-engine"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Perception Engine Backend (Node.js) - accessed via TLS proxy at https://localhost:3004
  # Source: ../RealityEngine_Manager/perception-engine/backend
  perception-engine-backend:
    build:
      context: ../RealityEngine_Manager/perception-engine/backend
      dockerfile: Dockerfile
    container_name: reality-engine-perception-backend
    environment:
      - PORT=3004
      - REALITY_ENGINE_URL=https://reality-engine:3000
      - DATA_PATH=/app/data
      - VECTOR_SIZE=${VECTOR_DIMENSION:-7680}
      - LOCAL_AI_BASE_URL=http://host.docker.internal:4000
      - TLS_CERT_PATH=/etc/certs/server.crt
      - TLS_KEY_PATH=/etc/certs/server.key
      - CA_CERT_PATH=/etc/certs/ca.crt
      # MQTT bridge — propagated from host shell.  When the operator runs
      # ./startUniverse.sh --mqtt-broker-url=... --mqtt-mappings=... the
      # script exports MQTT_BROKER_URL + MQTT_MAPPINGS_JSON (read from the
      # given file) and Docker passes them through here.  Default broker
      # (when env is empty but not unset) is mqtt://yuma.lateraledge.cloud:1883;
      # bridge still requires mappings before it actually boots.
      - MQTT_BROKER_URL
      - MQTT_BROKER_PORT
      - MQTT_CLIENT_ID
      - MQTT_USERNAME
      - MQTT_PASSWORD
      - MQTT_KEEPALIVE
      - MQTT_MAPPINGS_FILE
      - MQTT_MAPPINGS_JSON
      - MQTT_ALLOW_REGION_OVERLAP
      - MQTT_DISABLED
      - ACP_ENABLED
      - ACP_PLATFORM
      - ACP_SURFACE
      - ACP_GATEWAY_URL
      - OPENCLAW_GATEWAY_URL
      - ACP_SESSION_KEY
      - OPENCLAW_ACP_SESSION
      - ACP_TARGET_AGENT
      - ACP_COMPLETION_SOURCE_MAPPING_ID
      - HEALTHKIT_BRIDGE_TOKEN
      # Trigger dispatch config — propagated from host shell (startUniverse.sh
      # exports TRIGGERS_ENABLED/TRIGGER_DISPATCH_MODE). Without these the
      # Dockerized PE silently boots with triggers disabled.
      - TRIGGERS_ENABLED
      - TRIGGER_DISPATCH_MODE
      - TRIGGER_GRAPHQL_URL
      - INTEGRATIONS_CONFIG=/app/config/integrations.json
      - AUDIT_LOG_ENABLED=true
      - AUDIT_LOG_LEVEL=2
      - AUDIT_LOG_SERVICE=perception-engine
      # re:PerceptionEvent carries machineIri, which the PE resolves from the
      # corpus semantics manifest. Named explicitly rather than left to the
      # walk-up fallback, which cannot work in an image whose cwd is /app.
      - SEMANTICS_MANIFEST=/app/semantics/abox-manifest.json
    volumes:
      - perception_sources_data:/app/data
      - ./config:/app/config:ro
      - ./certs:/etc/certs:ro
      # Same join as the RE side: without the manifest every re:PerceptionEvent
      # reports machineIri null, which the contract also permits for a region
      # the PE cannot map — so a missing mount was indistinguishable from a
      # source that genuinely addresses no machine.
      - ${MACHINE_CORPUS_DIR:-${MACHINES_DIR:?MACHINES_DIR must be set — run via startUniverse.sh}}/semantics:/app/semantics:ro
    depends_on:
      reality-engine:
        condition: service_healthy
      loki:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - reality-network
    logging:
      driver: loki
      options:
        loki-url: "https://localhost:3100/loki/api/v1/push"
        loki-tls-insecure-skip-verify: "true"
        loki-batch-size: "400"
        loki-retries: "2"
        loki-max-backoff: "1000ms"
        loki-external-labels: "service=perception-engine-backend,environment=production,app=reality-engine"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://localhost:3004/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Perception Engine Frontend - accessed via TLS proxy at https://localhost:3005
  # Source: ../RealityEngine_Manager/perception-engine/frontend
  perception-engine-frontend:
    build:
      context: ../RealityEngine_Manager/perception-engine/frontend
      dockerfile: Dockerfile
    container_name: reality-engine-perception-frontend
    depends_on:
      - perception-engine-backend
    restart: unless-stopped
    networks:
      - reality-network
    logging:
      driver: loki
      options:
        loki-url: "https://localhost:3100/loki/api/v1/push"
        loki-tls-insecure-skip-verify: "true"
        loki-batch-size: "400"
        loki-retries: "2"
        loki-max-backoff: "1000ms"
        loki-external-labels: "service=perception-engine-frontend,environment=production,app=reality-engine"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Promtail — ships native runtime log files into Loki.
  # Mounts the three native log directories (CPP, LSP, Scala) and /tmp so that
  # Loki receives the same structured logs as Docker services do via the
  # logging driver.  Runs alongside the compose stack; processes that are not
  # running simply produce no log lines.
  promtail:
    image: grafana/promtail:2.9.3
    container_name: reality-engine-promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./config/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - ./certs:/etc/promtail/certs:ro
      - ${CPP_LOG_DIR:-../RealityEngine_CPP/logs}:/host-logs/cpp/logs:ro
      - ${LSP_LOG_DIR:-../RealityEngine_LSP/logs}:/host-logs/lsp/logs:ro
      - ${SCALA_LOG_DIR:-../RealityEngine_Scala/logs}:/host-logs/scala/logs:ro
      - /tmp:/host-logs/tmp:ro
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - reality-network

  # TLS Termination Proxy — the only service that binds external ports.
  # Terminates HTTPS/WSS from clients and re-encrypts to internal HTTPS backends.
  # Requires: run bash certs/generate-dev-certs.sh first.
  tls-proxy:
    image: nginx:alpine
    container_name: reality-engine-tls-proxy
    ports:
      - "3000:3000"
      - "3001:3001"
      - "3004:3004"
      - "3005:3005"
      - "5001:5001"
      - "5173:5173"
    volumes:
      - ./nginx/tls-proxy.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      reality-engine:
        condition: service_healthy
      visualizer-backend:
        condition: service_healthy
      visualizer-frontend:
        condition: service_healthy
      grafana:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - reality-network
    logging:
      driver: loki
      options:
        loki-url: "https://localhost:3100/loki/api/v1/push"
        loki-tls-insecure-skip-verify: "true"
        loki-batch-size: "400"
        loki-retries: "2"
        loki-max-backoff: "1000ms"
        loki-external-labels: "service=tls-proxy,environment=production,app=reality-engine"
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  loki_data:
    driver: local
  grafana_data:
    driver: local
  prometheus_data:
    driver: local
  perception_sources_data:
    driver: local

networks:
  reality-network:
    driver: bridge
