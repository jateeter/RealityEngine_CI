# The RealityEngine release: the fixed services of one install (ReleaseRoadmap C1).
#
# Not run by hand. `realityengine install` / `up` runs re-init, which writes this
# file into the install directory beside compose.engines.yml (one RE and one PE
# service per instance of the engine spec) and .env (image references, ports and
# secrets); COMPOSE_FILE in .env joins the two.
#
# Every first-party image is ${RE_IMAGE_*} from .env, by digest for a release
# (A2). Third-party images are pinned here by tag and digest, at the versions of
# RealityEngine_CI/config/shared-service-versions.json, linux/arm64 (A4).
# Nothing here builds, and nothing mounts a source checkout: host paths are the
# install directory's generated files, and data lives in named volumes.

name: ${COMPOSE_PROJECT_NAME:-realityengine}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-common: &common
  restart: unless-stopped
  networks: [realityengine]
  extra_hosts:
    - "host.docker.internal:host-gateway"
  logging: *logging

services:

  # ── One-shot preparation ─────────────────────────────────────────────────────

  # Copies the release corpus into its volumes: the regression corpus the
  # engines boot with, localAI's machines, and (once) the Load Machines catalog.
  corpus:
    image: ${RE_IMAGE_CORPUS}
    restart: "no"
    user: "0:0"     # writes the corpus volumes; the image itself is unprivileged
    networks: [realityengine]
    logging: *logging
    volumes:
      - corpus-boot:/volumes/boot
      - corpus-catalog:/volumes/catalog
      - localai-machines:/volumes/localai-machines

  # Makes the engines' shared clock volume writable by every engine's user.
  prepare:
    image: ${RE_IMAGE_INIT}
    restart: "no"
    user: "0:0"     # sets the clock volume's mode; the image itself is unprivileged
    networks: [realityengine]
    logging: *logging
    command: ["prepare-volumes", "--clock", "/var/lib/reality-engine/clock"]
    volumes:
      - engine-clock:/var/lib/reality-engine/clock

  # ── The instance registry ────────────────────────────────────────────────────

  registry:
    <<: *common
    image: ${RE_IMAGE_INIT}
    command: ["serve-registry", "--dir", "/install/registry", "--port", "8000"]
    volumes:
      - ./registry:/install/registry:ro
    ports:
      - "127.0.0.1:${RE_PORT_REGISTRY:-5999}:8000"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/re-registry.json',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

  # ── Vector store and cache (shared by localAI and the engines) ──────────────

  qdrant:
    <<: *common
    image: qdrant/qdrant:v1.20.0@sha256:9bfc89f9914fc14876a88c05270685921a55b8877b254a98bcc1cc2f0a424cd2
    volumes:
      - qdrant-data:/qdrant/storage
    # On the host as in the native lane (4333), for tools and the RAG specs.
    ports:
      - "127.0.0.1:${RE_PORT_QDRANT:-4333}:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    <<: *common
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6

  # ── localAIStack ─────────────────────────────────────────────────────────────

  localai-api:
    <<: *common
    image: ${RE_IMAGE_LOCALAI_API}
    environment:
      # Ollama runs natively on the Mac, for the Apple GPU (A6).
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      REDIS_URL: redis://redis:6379
      LLM_MODEL: ${LLM_MODEL:-nemotron-3-nano:4b-mlx}
      # localAIStack's model registry default (config/models.registry.json): it
      # runs on MLX, 768-dim (RealityEngine_CI#593; each role's default must run
      # on MLX). Vectors from another embedder do not mix, so changing it means
      # `realityengine reembed`, which `up` and `upgrade` also run when needed.
      EMBED_MODEL: ${EMBED_MODEL:-embeddinggemma-2:270m}
      EMBED_DIM: ${EMBED_DIM:-768}
      COLLECTION_NAME: localai_docs
      LOG_LEVEL: info
      # The instance registry wins over RE_URL/PE_URL, which stay unset.
      RE_REGISTRY_URL: http://registry:8000/re-registry.internal.json
      # localAI registers its own machines with each engine when it starts, so
      # it must restart when the instances change: carrying the spec in its
      # environment makes compose recreate it on every spec change. Without
      # this an instance added by `up --engines` lacked localAI's machines.
      RE_ENGINES: ${RE_ENGINES}
      RE_SSL_VERIFY: "false"
      HEALTHKIT_BRIDGE_TOKEN: ${HEALTHKIT_BRIDGE_TOKEN}
    volumes:
      - localai-state:/app/state
    ports:
      - "127.0.0.1:${RE_PORT_LOCALAI:-4000}:8000"
    depends_on:
      qdrant: {condition: service_healthy}
      redis: {condition: service_healthy}
      registry: {condition: service_healthy}

  # ── OpenClaw ─────────────────────────────────────────────────────────────────
  # The gateway is not a container (RealityEngine_CI#592): it is the Mac's own
  # openclaw, a LaunchAgent on 127.0.0.1:${RE_PORT_OPENCLAW} that `realityengine
  # up` starts once these are running. Containers reach it at host.docker.internal.

  browser:
    <<: *common
    image: coollabsio/openclaw-browser:0.3.0@sha256:c5f8a9d812992429be2c5a0b6b8f5d70d63e81cc1b381c5475e067a91e0d3179
    environment:
      # The image starts Chromium as `wrapped-chromium ${CHROME_CLI}` and proxies
      # its debugging port through nginx on 9223; without this the proxy answers
      # 502 and the gateway cannot attach.
      CHROME_CLI: --remote-debugging-port=9222
      PUID: "1000"
      PGID: "1000"
      TZ: UTC
    volumes:
      - browser-config:/config
    # CDP for the gateway on the Mac. Loopback only: CDP is unauthenticated.
    ports:
      - "127.0.0.1:${RE_PORT_BROWSER_CDP:-9222}:9223"
    shm_size: 2g
    security_opt: [no-new-privileges:true]

  open-webui:
    <<: *common
    image: ghcr.io/open-webui/open-webui:v0.11.3@sha256:41daa0cf2561a5d4c8d1ff31ee2a98d93ab4d3ac2605cac69366ff6a3374a933
    environment:
      OPENAI_API_BASE_URL: http://host.docker.internal:${RE_PORT_OPENCLAW:-18789}/v1
      OPENAI_API_KEY: ${OPENCLAW_GATEWAY_TOKEN}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      # Embed through the host Ollama, with the model localAI already requires.
      # The default engine downloads sentence-transformers/all-MiniLM-L6-v2 from
      # HuggingFace on a fresh volume, unauthenticated, before the service is
      # ready; on 2026-10-19 that took 16 minutes and outlasted the install's
      # 900s wait (run e1-rc1-20261019a), and offline it never finishes.
      RAG_EMBEDDING_ENGINE: ollama
      RAG_EMBEDDING_MODEL: ${EMBED_MODEL:-embeddinggemma-2:270m}
      ENABLE_OPENAI_API: "true"
      WEBUI_AUTH: "true"
      WEBUI_NAME: RealityEngine-WebUI
      WEBUI_ADMIN_EMAIL: ${WEBUI_ADMIN_EMAIL}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD}
      WEBUI_ADMIN_NAME: Admin
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      ENABLE_SIGNUP: "false"
      ENABLE_PASSWORD_VALIDATION: "true"
      CORS_ALLOW_ORIGIN: "http://localhost:${RE_PORT_WEBUI:-8080};http://127.0.0.1:${RE_PORT_WEBUI:-8080}"
    volumes:
      - openwebui-data:/app/backend/data
    ports:
      - "127.0.0.1:${RE_PORT_WEBUI:-8080}:8080"
    security_opt: [no-new-privileges:true]

  # ── PIM and the Solid Community Server (the authoritative POD) ──────────────

  css:
    <<: *common
    image: ${RE_IMAGE_CSS}
    command: ["-c", "@css:config/file.json", "-f", "/data", "-p", "13000", "-b", "http://css.localhost:13000/"]
    environment:
      CSS_LOGGING_LEVEL: warn
      OPENCOMMONS_ACCOUNT_EMAIL: ${CSS_ACCOUNT_EMAIL}
      OPENCOMMONS_ACCOUNT_PASSWORD: ${CSS_ACCOUNT_PASSWORD}
      OPENCOMMONS_POD_NAME: owner
    volumes:
      - css-data:/data
    networks:
      realityengine:
        aliases: [css.localhost]
    ports:
      - "127.0.0.1:${RE_PORT_CSS:-13000}:13000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:13000/ || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 36
      start_period: 60s

  # Provisions the Solid account and pod and writes PIM's client credentials,
  # from the PIM image, then hands them to its node user (PIM#84).
  pim-bootstrap:
    image: ${RE_IMAGE_PIM}
    restart: "no"
    networks: [realityengine]
    logging: *logging
    user: "0:0"
    command: ["sh", "-c", "node /app/scripts/provision-css.mjs && chown -R node:node /credentials"]
    environment:
      CSS_BASE_URL: http://css.localhost:13000/
      CSS_ACCOUNT_EMAIL: ${CSS_ACCOUNT_EMAIL}
      CSS_ACCOUNT_PASSWORD: ${CSS_ACCOUNT_PASSWORD}
      CSS_POD_NAME: owner
      CSS_CLIENT_CREDENTIALS_FILE: /credentials/client-credentials.json
    volumes:
      - css-credentials:/credentials
    depends_on:
      css: {condition: service_healthy}

  pim:
    <<: *common
    image: ${RE_IMAGE_PIM}
    environment:
      NODE_ENV: production
      PORT: "8080"
      HOST: 0.0.0.0
      SOLID_POD_SERVER_URL: http://css.localhost:13000
      SOLID_OIDC_ISSUER: http://css.localhost:13000
      SOLID_POD_BASE_URL: http://css.localhost:13000/owner/
      SOLID_POD_PATH: /health-pim/
      SOLID_REDIRECT_URL: http://localhost:${RE_PORT_PIM:-8090}/callback
      SOLID_CLIENT_CREDENTIALS_FILE: /run/opencommons/client-credentials.json
      EPIC_ENABLED: "false"
      EPIC_MODE: mock
      PIM_HEALTHKIT_BRIDGE_TOKEN: ${HEALTHKIT_BRIDGE_TOKEN}
      HEALTHKIT_BRIDGE_ID: healthkit-ios-bridge
      # PIM pushes the owner's approved metric set to every PE (D2b).
      HEALTHKIT_PE_SCOPE_URLS: ${HEALTHKIT_PE_SCOPE_URLS}
      HEALTHKIT_PE_TOKEN: ${HEALTHKIT_BRIDGE_TOKEN}
    volumes:
      - css-credentials:/run/opencommons:ro
    ports:
      - "127.0.0.1:${RE_PORT_PIM:-8090}:8080"
    depends_on:
      pim-bootstrap: {condition: service_completed_successfully}

  # ── MCP ──────────────────────────────────────────────────────────────────────

  mcp:
    <<: *common
    image: ${RE_IMAGE_MCP}
    environment:
      RE_REGISTRY_URL: http://registry:8000/re-registry.internal.json
      RE_MCP_HTTP_HOST: 0.0.0.0
      RE_MCP_HTTP_PORT: "7331"
    ports:
      - "127.0.0.1:${RE_PORT_MCP:-7331}:7331"
    depends_on:
      registry: {condition: service_healthy}

  # ── Manager ──────────────────────────────────────────────────────────────────

  visualizer-backend:
    <<: *common
    image: ${RE_IMAGE_VISUALIZER_BACKEND}
    environment:
      VIZ_PORT: "3001"
      RE_REGISTRY_URL: http://registry:8000/re-registry.internal.json
      # The Load Machines catalog: RealityEngine_Machines at the release commit,
      # or newer after `realityengine machines sync`, plus localAI's own (A8).
      MACHINES_DIR: /app/corpus
      MACHINES_CATALOG_EXTRA_DIRS: /app/catalog-extra
      TLS_CERT_PATH: /etc/certs/server.crt
      TLS_KEY_PATH: /etc/certs/server.key
      NODE_EXTRA_CA_CERTS: /etc/certs/ca.crt
      ALLOWED_ORIGINS: "https://localhost:${RE_PORT_MANAGER_UI:-5173},https://localhost:${RE_PORT_MANAGER_API:-3001},https://${HOST_IP}:${RE_PORT_MANAGER_UI:-5173},https://${HOST_IP}:${RE_PORT_MANAGER_API:-3001}"
      AUDIT_LOG_ENABLED: "true"
      AUDIT_LOG_LEVEL: "2"
      AUDIT_LOG_SERVICE: visualizer-backend
      VIZ_CACHE_TTL_MS: "500"
      VIZ_RATE_LIMIT_MAX: "5000"
      VIZ_MACHINES_RATE_LIMIT_MAX: "2000"
    volumes:
      - ./certs:/etc/certs:ro
      - corpus-catalog:/app/corpus:ro
      - localai-machines:/app/catalog-extra:ro
    depends_on:
      registry: {condition: service_healthy}
      corpus: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "--no-check-certificate", "https://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 6

  visualizer-frontend:
    <<: *common
    image: ${RE_IMAGE_VISUALIZER_FRONTEND}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/"]
      interval: 15s
      timeout: 5s
      retries: 6

  tls-proxy:
    <<: *common
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "${RE_PORT_MANAGER_UI:-5173}:5173"
      - "${RE_PORT_MANAGER_API:-3001}:3001"
    depends_on:
      visualizer-backend: {condition: service_healthy}
      visualizer-frontend: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Monitoring: one stack ────────────────────────────────────────────────────

  loki:
    <<: *common
    image: grafana/loki:3.4.2@sha256:58a6c186ce78ba04d58bfe2a927eff296ba733a430df09645d56cdc158f3ba08
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./config/loki.yml:/etc/loki/local-config.yaml:ro
      - ./certs:/etc/loki/certs:ro
      - loki-data:/loki
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  # The AI bridge metrics the AI Bridge Operations and localAIStack Overview
  # dashboards read: the OpenClaw gateway, localAI, Qdrant and the Mac's Ollama,
  # probed at scrape time. The native lane runs the same exporter on the host
  # (startUniverse.sh); here it runs on the Manager backend image, which has Node.
  bridge-metrics:
    <<: *common
    image: ${RE_IMAGE_VISUALIZER_BACKEND}
    user: "1000:1000"
    entrypoint: ["node", "/opt/bridge/bridge-metrics-exporter.mjs"]
    command: []
    environment:
      BRIDGE_METRICS_HOST: 0.0.0.0
      BRIDGE_METRICS_PORT: "7342"
      OPENCLAW_GATEWAY_URL: http://host.docker.internal:${RE_PORT_OPENCLAW:-18789}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      LOCALAI_API_URL: http://localai-api:8000
      QDRANT_URL: http://qdrant:6333
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    volumes:
      - ./config/bridge-metrics-exporter.mjs:/opt/bridge/bridge-metrics-exporter.mjs:ro
    security_opt: [no-new-privileges:true]

  # Ships every container's log to Loki through the Docker API; no logging
  # plugin is needed on the Mac.
  promtail:
    <<: *common
    image: grafana/promtail:3.4.2@sha256:c6e9a987ca086cbfef945b8ebd708eb09f98b5e78bfb659e4e5a8b3bd604d11b
    command: ["-config.file=/etc/promtail/promtail.yml", "-config.expand-env=true"]
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-realityengine}
    volumes:
      - ./config/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki: {condition: service_healthy}

  prometheus:
    <<: *common
    image: prom/prometheus:v2.53.4@sha256:502ad90314c7485892ce696cb14a99fceab9fc27af29f4b427f41bd39701a199
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.listen-address=:9090
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/file_sd:/etc/prometheus/file_sd:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${RE_PORT_PROMETHEUS:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 3

  grafana:
    <<: *common
    image: grafana/grafana:11.6.1@sha256:52c3e20686b860c6dc1f623811565773cf51eefa378817a4896dfc863c3c82c8
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SERVER_ROOT_URL: http://localhost:${RE_PORT_GRAFANA:-3002}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./config/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./config/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${RE_PORT_GRAFANA:-3002}:3000"
    depends_on:
      loki: {condition: service_healthy}
      prometheus: {condition: service_healthy}

networks:
  realityengine:
    name: ${COMPOSE_PROJECT_NAME:-realityengine}

volumes:
  corpus-boot:
  corpus-catalog:
  localai-machines:
  engine-clock:
  qdrant-data:
  redis-data:
  localai-state:
  browser-config:
  openwebui-data:
  css-data:
  css-credentials:
  loki-data:
  prometheus-data:
  grafana-data:
