# TLS front end for Manager in a RealityEngine release install, with the
# install's own CA. 5173 is the Visualizer (static frontend, its API and its
# WebSocket); 3001 is the Visualizer backend directly, which the frontend's
# WebSocket also reaches (<host>:3001/ws). 3004 is Manager's TypeScript PE
# (a non-voting follower, with its own Scala RE) and 3000 is Grafana, as the
# development proxy serves them (owner, 2026-11-12).

events {
    worker_connections 1024;
}

http {
    proxy_ssl_verify              on;
    proxy_ssl_trusted_certificate /etc/nginx/certs/ca.crt;
    proxy_ssl_server_name         on;
    proxy_ssl_protocols           TLSv1.2 TLSv1.3;
    proxy_ssl_session_reuse       on;

    # Resolve containers at request time, so a backend restart does not leave
    # the proxy holding a stale address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server {
        listen 5173 ssl;
        server_name _;
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        error_page 497 https://$host:5173$request_uri;

        set $viz_backend  https://visualizer-backend:3001;
        set $viz_frontend http://visualizer-frontend:80;

        location /ws {
            proxy_pass         $viz_backend;
            proxy_ssl_name     visualizer-backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_read_timeout 86400s;
        }
        location /api {
            proxy_pass         $viz_backend;
            proxy_ssl_name     visualizer-backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
        }
        location / {
            proxy_pass         $viz_frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
        }
    }

    server {
        listen 3001 ssl;
        server_name _;
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        error_page 497 https://$host:3001$request_uri;

        set $viz_backend https://visualizer-backend:3001;

        location /ws {
            proxy_pass         $viz_backend;
            proxy_ssl_name     visualizer-backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_read_timeout 86400s;
        }
        location / {
            proxy_pass         $viz_backend;
            proxy_ssl_name     visualizer-backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
        }
    }

    server {
        listen 3004 ssl;
        server_name _;
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        error_page 497 https://$host:3004$request_uri;

        set $ts_pe https://perception-engine-backend:3004;

        location /ws {
            proxy_pass         $ts_pe;
            proxy_ssl_name     perception-engine-backend;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_read_timeout 86400s;
        }
        location / {
            proxy_pass         $ts_pe;
            proxy_ssl_name     perception-engine-backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
        }
    }

    server {
        listen 3000 ssl;
        server_name _;
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        error_page 497 https://$host:3000$request_uri;

        # Grafana's OpenSSL front, on the lane's mTLS (the lane config presents
        # the proxy's certificate). With the install's TLS off there is no front,
        # and Grafana is on its own port (RE_PORT_GRAFANA) only.
        set $grafana https://grafana:3443;

        location / {
            proxy_pass         $grafana;
            proxy_ssl_name     grafana;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
        }
    }
}
