    version: "1.1.0-lsp"
    description: |
      OpenAPI contract for the Common Lisp (SBCL / Hunchentoot) Perception Engine runtime.

      Default native port: **5600**.
      Additional LSP instances add +100 per pair (lsp-2: 5700, lsp-3: 5800).
      In Docker/CI deployments the TLS proxy exposes the PE at `https://localhost:3004`.

      Wire-compatible with the CPP (C++) and Scala runtimes.
  servers:
    - url: http://localhost:5600
      description: Local LSP Perception Engine (native, instance lsp-1)
    - url: https://localhost:3004
      description: Docker TLS proxy (CI deployment)
